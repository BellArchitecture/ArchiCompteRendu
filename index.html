<!-- PlanSync CR v1.0 — 22/05/2026 -->

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlanSync CR — Compte Rendus Chantier</title>
<meta name="robots" content="noindex,nofollow,nosnippet">
<meta name="description" content="Gestion des comptes rendus de chantier : intervenants, remarques par lot, actions, historique, export PDF.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232d4ef5'/><text x='50%25' y='55%25' font-size='18' text-anchor='middle' dominant-baseline='middle' fill='white' font-family='Arial' font-weight='bold'>PS</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3ef;--bg2:#eceae4;--bg3:#e3e1da;
  --panel:#faf9f7;--border:#dbd9d1;--border2:#ccc9bf;
  --text:#1c1b18;--text2:#4a4840;--text3:#8a877e;
  --blue:#C0B7B6;--blue-bg:#f5f2f2;--blue-lt:#e8e2e1;
  --green:#1a7a4a;--green-bg:#e8f5ee;
  --amber:#c47a00;--amber-bg:#fef3d8;
  --red:#c0392b;--red-bg:#fdecea;
  --purple:#6b3fa0;--purple-bg:#f0ebfa;
  --r:10px;--r2:14px;
  --shadow:0 1px 4px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.05);
  --shadow2:0 4px 20px rgba(0,0,0,.12);
  font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text)
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);height:100vh;overflow:hidden;font-family:inherit}
.app{display:flex;height:100vh}
.sidebar{width:260px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sb-head{padding:14px 14px 10px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.logo-mark{width:26px;height:26px;background:var(--blue);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
.sb-list{flex:1;overflow-y:auto;padding:8px}
.cr-item{padding:10px 12px;border-radius:var(--r);cursor:pointer;border:1px solid transparent;margin-bottom:4px;transition:all .12s}
.cr-item.cr-arch{opacity:.6;border-left:3px solid var(--amber)}
.cr-item.active{background:var(--blue-bg);border-color:var(--blue-lt)}
.cr-item-date{font-size:11px;font-weight:600;color:var(--text3);margin-bottom:2px}
.cr-item-proj{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-item-sub{font-size:11px;color:var(--text3);margin-top:2px;display:flex;gap:8px;align-items:center}
.sb-foot{padding:10px 14px;border-top:1px solid var(--border)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--panel);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border:1px solid var(--border2);border-radius:var(--r);background:var(--panel);color:var(--text);font-size:12px;cursor:pointer;font-weight:500;font-family:inherit;transition:all .12s;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn-p{background:var(--blue);color:#3d3533;border-color:var(--blue)}
.btn-p:hover{background:#a89e9d}
.btn-sm{padding:5px 10px;font-size:11.5px}
.btn-g{border:none;background:none;cursor:pointer;font-family:inherit}
.btn-g:hover{background:var(--bg2);border-radius:6px}
.content{flex:1;overflow-y:auto}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px}
.bgreen{background:var(--green-bg);color:var(--green)}
.bamber{background:var(--amber-bg);color:var(--amber)}
.bblue{background:var(--blue-bg);color:var(--blue)}
.bred{background:var(--red-bg);color:var(--red)}
.bgray{background:var(--bg2);color:var(--text3)}
.bpurple{background:var(--purple-bg);color:var(--purple)}
/* CR VIEW */
.cr-header{background:var(--panel);border-bottom:1px solid var(--border);padding:16px 24px}
.cr-meta{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap}
.section{margin-bottom:20px}
.section-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px}
/* Intervenants */
.int-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.int-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px}
.int-lot{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.int-ent{font-size:13px;font-weight:500;margin-bottom:2px}
.int-contact{font-size:11.5px;color:var(--text3)}
/* Remarques */
.lot-block{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.lot-head{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;transition:background .1s}
.lot-head:hover{background:var(--bg2)}
.lot-head-left{display:flex;align-items:center;gap:9px}
.lot-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.lot-title{font-weight:500;font-size:13.5px}
.lot-body{border-top:1px solid var(--border);padding:12px 16px}
.remarque-item{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.remarque-item:last-child{border-bottom:none}
.ri-check{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.ri-check.done{background:var(--blue);border-color:var(--blue);color:#3d3533;}
.ri-check.flagged{background:var(--amber-bg);border-color:var(--amber)}
.ri-text{flex:1;font-size:13px;line-height:1.5}
.ri-text.done-text{text-decoration:line-through;color:var(--text3)}
.ri-actions{display:flex;gap:3px;opacity:0;flex-shrink:0;transition:opacity .12s}
.remarque-item:hover .ri-actions{opacity:1}
/* Actions/décisions */
.action-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:7px;transition:border-color .12s}
.action-row:hover{border-color:var(--border2)}
.action-row.done{opacity:.5}
.ar-status{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:600;cursor:pointer}
/* Tabs */
.tabbar{display:flex;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.tab{padding:10px 16px;font-size:12px;font-weight:500;border:none;background:none;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;font-family:inherit;white-space:nowrap}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
/* New CR form */
.form-section{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:18px;margin-bottom:14px}
.form-section-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.fi{margin-bottom:12px}
.fi label{display:block;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.fi input,.fi select,.fi textarea{width:100%;padding:8px 10px;border:1px solid var(--border2);border-radius:8px;font-size:13px;background:var(--bg);color:var(--text);outline:none;font-family:inherit}
.fi input:focus,.fi select:focus,.fi textarea:focus{border-color:var(--blue);background:var(--panel)}
.fi textarea{resize:vertical;min-height:72px}
/* Modal */
.mo-ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px)}
.mo-box{background:var(--panel);border-radius:var(--r2);padding:24px;width:480px;max-width:95vw;border:1px solid var(--border);box-shadow:var(--shadow2);max-height:90vh;overflow-y:auto}
.mo-box h3{font-size:15px;font-weight:600;margin-bottom:16px}
.mo-foot{display:flex;gap:7px;margin-top:16px;justify-content:flex-end}
/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200;white-space:nowrap}
/* Print */
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:#fff!important;margin:0;padding:0;font-family:Arial,sans-serif;font-size:10pt;color:#000}
  .app{display:block!important;height:auto!important}
  .sidebar,.topbar,.tabbar,.ri-actions,.btn,.sb-foot,.print-hide{display:none!important}
  .main{display:block!important;overflow:visible!important}
  .content{display:none!important}
  #print-area{display:block!important}
  .pr-page{page-break-after:always}
  .pr-page:last-child{page-break-after:avoid}
}
#print-area{display:none}
/* SVG */
.ico{display:inline-block;width:16px;height:16px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico-lg{width:19px;height:19px}
.ico-sm{width:14px;height:14px}
.ico-xs{width:12px;height:12px}
.sortable-ghost{opacity:.3;background:var(--blue-bg)!important;border-color:var(--blue)!important}
.sort-handle{cursor:grab}.sort-handle:active{cursor:grabbing}

/* ══ AUTH ══ */
#auth-overlay{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column}
#auth-overlay.hidden{display:none}
.auth-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:36px 40px;width:340px;box-shadow:var(--shadow2);text-align:center}
.auth-box .logo-mark{margin:0 auto 16px;width:44px;height:44px;font-size:16px;border-radius:10px}
.auth-error{color:var(--red);font-size:12px;margin-top:8px;min-height:16px}
</style>
</head>

<div id="auth-overlay">
  <div class="auth-box">
    <div class="logo-mark" id="auth-logo-mark" style="background:var(--blue);display:flex;align-items:center;justify-content:center;color:#3d3533;font-weight:700;font-size:16px">PS</div>
    <div style="font-weight:700;font-size:18px;margin-bottom:4px" id="auth-firm-name">PlanSync</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:24px">Compte Rendus Chantier</div>
    <div class="fi" style="text-align:left">
      <label style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px">Mot de passe</label>
      <input type="password" id="auth-pwd" placeholder="••••••••"
        style="width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:8px;font-size:14px;background:var(--bg);color:var(--text);outline:none;font-family:inherit"
        onkeydown="if(event.key==='Enter')checkAuth()">
    </div>
    <div class="auth-error" id="auth-error"></div>
    <button class="btn btn-p" style="width:100%;justify-content:center;margin-top:12px;padding:10px" onclick="checkAuth()">
      Accéder
    </button>
    <div style="font-size:10px;color:var(--text3);margin-top:16px">Usage interne — accès restreint</div>
  </div>
</div>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sb-head" style="cursor:pointer" onclick="openPdfSettings()" title="Paramètres du cabinet / PDF">
      <div class="logo" id="sb-logo">
        <div class="logo-mark" id="sb-logo-mark">PS</div>
        <div>
          <div style="font-weight:600;font-size:14px;letter-spacing:-.2px" id="sb-firm-name">PlanSync</div>
          <div style="font-size:10px;color:var(--text3)" id="sb-firm-sub">Compte Rendus</div>
        </div>
      </div>
    </div>

    <!-- Search -->
    <div style="padding:8px 10px;border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:6px;background:var(--bg2);border-radius:8px;padding:6px 10px">
        <svg class="ico ico-sm" style="color:var(--text3);flex-shrink:0"><use href="#i-search"/></svg>
        <input id="search-input" placeholder="Rechercher…" style="border:none;background:none;outline:none;font-size:12px;color:var(--text);width:100%;font-family:inherit" oninput="filterCR(this.value)">
      </div>
    </div>

    <div class="sb-list" id="cr-list"></div>

    <div class="sb-foot">
      <div style="display:flex;gap:6px">
        <button class="btn btn-p" style="flex:1;justify-content:center" onclick="openNewCR()">
          <svg class="ico ico-sm"><use href="#i-plus"/></svg> Nouveau CR
        </button>
        <button class="btn" style="padding:7px 10px;flex-shrink:0" onclick="openTemplates()" title="Modèles">
          <svg class="ico ico-sm"><use href="#i-file"/></svg>
        </button>
        <button class="btn" style="padding:7px 10px;flex-shrink:0" onclick="openPdfSettings()" title="Paramètres PDF / Cabinet">
          <svg class="ico ico-sm"><use href="#i-settings"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar" id="topbar">
      <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
        <svg class="ico ico-lg" style="color:var(--blue);flex-shrink:0" id="tb-icon"><use href="#i-file"/></svg>
        <div style="min-width:0">
          <div style="display:flex;align-items:center;gap:6px">
            <div style="font-weight:600;font-size:15px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="tb-title">Compte Rendus Chantier</div>
            <div id="dirty-dot" style="display:none;width:7px;height:7px;border-radius:50%;background:var(--amber);flex-shrink:0" title="Modifications non exportées"></div>
          </div>
          <div style="font-size:11px;color:var(--text3)" id="tb-sub">Sélectionnez un compte rendu</div>
        </div>
      </div>
      <div style="display:flex;gap:6px" id="tb-actions"></div>
    </div>
    <div class="tabbar" id="tabbar" style="display:none">
      <button class="tab active" onclick="switchTab('remarques',this)">Remarques par lot</button>
      <button class="tab" onclick="switchTab('intervenants',this)">Intervenants</button>
      <button class="tab" onclick="switchTab('actions',this)">Actions / Décisions</button>
      <button class="tab" onclick="switchTab('dates',this)">Dates</button>

function lotColor(lot){

}
// Centralized color resolver: lot→intervenant→derived
function getColor(obj, cr){
  if(!cr) return LOT_COLORS.DEFAULT;
  // If it's a lot — get from its linked intervenant
  if(obj && obj.intId !== undefined){
    const int=cr.intervenants.find(function(i){return i.id===obj.intId;});
    if(int) return int.color||lotColor(int.lot);
    return obj.color||lotColor(obj.titre||'');
  }
  // If it's an intervenant
  if(obj && obj.id && obj.lot !== undefined){
    return obj.color||lotColor(obj.lot);
  }
  return LOT_COLORS.DEFAULT;
}

/* ══ AUTH ══ */
// ⚠️ Protection côté client uniquement — ne remplace pas une vraie protection Vercel/Auth côté serveur.
// Stocker le SHA-256 du mot de passe (jamais le mot de passe en clair).
const AUTH_HASH='963364b3915b6b43f2192109c3b2511b1344b0406dacfbc3685ff8b9d3b18efd';

async function checkAuth(){
  const pwd=document.getElementById('auth-pwd')?.value||'';
  if(!pwd){showAuthError('Entrez le mot de passe');return;}
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pwd));
    const hash=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    if(hash===AUTH_HASH){
      isAuthenticated=true;
      sessionStorage.setItem('ps_auth','1');
      document.getElementById('auth-overlay').classList.add('hidden');
      renderList();
      updateSidebarLogo();
    } else {
      showAuthError('Mot de passe incorrect');
      document.getElementById('auth-pwd').value='';
      document.getElementById('auth-pwd').focus();
    }
  }catch(e){
    showAuthError('Erreur de vérification — navigateur non compatible');
  }
}
function showAuthError(msg){
  const el=document.getElementById('auth-error');
  if(el)el.textContent=msg;
  setTimeout(()=>{if(el)el.textContent='';},3000);
}
function initAuth(){
  // Restore session if still valid
  if(sessionStorage.getItem('ps_auth')==='1'){
    isAuthenticated=true;
    const overlay=document.getElementById('auth-overlay');
    if(overlay)overlay.classList.add('hidden');
  } else {
    // Focus password field
    setTimeout(()=>document.getElementById('auth-pwd')?.focus(),100);
  }
  // Sync firm name on auth screen
  const fn=document.getElementById('auth-firm-name');
  if(fn)fn.textContent=PDF_SETTINGS.firmName||'PlanSync';
  const lm=document.getElementById('auth-logo-mark');
  if(lm){
    if(PDF_SETTINGS.logoLeft){
      lm.innerHTML='<img src="'+PDF_SETTINGS.logoLeft+'" style="width:100%;height:100%;object-fit:contain;border-radius:8px">';
      lm.style.background='none';
    } else {
      const initials=(PDF_SETTINGS.firmName||'PS').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()||'PS';
      lm.textContent=initials;
    }
  }
}

/* ══ SIDEBAR ══ */
function renderList(){
  const el=document.getElementById('cr-list');
  const q=searchQuery;
  const matches=cr=>!q||cr.projet.toLowerCase().includes(q)||cr.date.includes(q)||cr.adresse.toLowerCase().includes(q);

  const active=CRS.filter(cr=>cr.statut!=='archived'&&matches(cr));
  const archived=CRS.filter(cr=>cr.statut==='archived'&&matches(cr));

  function crCard(cr){
    const flagCount=cr.lots.flatMap(l=>l.remarques).filter(r=>r.flag&&!r.archived).length;
    const doneCount=cr.lots.flatMap(l=>l.remarques).filter(r=>r.archived).length;
    const total=cr.lots.flatMap(l=>l.remarques).length;
    const allDone=total>0&&doneCount===total;
    return `<div class="cr-item ${activeCR===cr.id?'active':''} ${cr.statut==='archived'?'cr-arch':''}" onclick="openCR('${cr.id}')">
      <div class="cr-item-date">${cr.date}${cr.statut==='archived'?' <span style="font-size:9px;background:var(--amber-bg);color:var(--amber);padding:1px 5px;border-radius:4px">Archivé</span>':''}</div>
      <div class="cr-item-proj">${cr.projet}</div>
      <div style="font-size:11px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${cr.adresse}</div>
      <div class="cr-item-sub">
        <span class="badge ${allDone?'bgreen':'bgray'}" style="font-size:9px">${doneCount}/${total}</span>
        ${flagCount?`<span class="badge bamber" style="font-size:9px">${flagCount} ⚑</span>`:''}
        <span style="font-size:10px;color:var(--text3);margin-left:auto">CR n°${cr.numero}</span>
      </div>
    </div>`;
  }

  let html='';

  if(active.length){
    html+=`<div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:8px 6px 4px">En cours (${active.length})</div>`;
    html+=active.map(crCard).join('');
  }

  // History toggle button
  html+=`<button onclick="showHistory=!showHistory;renderList()" style="width:100%;display:flex;align-items:center;gap:6px;padding:8px 6px;border:none;background:none;cursor:pointer;font-family:inherit;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-top:6px">
    <svg class="ico ico-xs" style="transition:transform .2s;transform:rotate(${showHistory?'90':'0'}deg)"><use href="#i-chevron-right"/></svg>
    Historique (${archived.length})
  </button>`;

  if(showHistory&&archived.length){
    html+=archived.map(crCard).join('');
  }

  if(!active.length&&!archived.length){
    html='<div style="text-align:center;padding:24px;font-size:12px;color:var(--text3)">Aucun résultat</div>';
  }

  el.innerHTML=html;
}

function filterCR(q){searchQuery=q.toLowerCase();renderList();}

function openCR(id){
  activeCR=id;
  activeTab='remarques';
  remarqueSearch='';
  actionFilter='';
  lotsSortedByFlags=false;
  renderList();
  renderCR();
}

function renderCR(){
  const cr=CRS.find(c=>c.id===activeCR);
  if(!cr)return;

  document.getElementById('tb-title').textContent=cr.projet;
  document.getElementById('tb-sub').textContent=`CR n°${cr.numero} — ${cr.date} — Prochaine réunion: ${cr.dateProchaine}`;
  document.getElementById('tb-icon').innerHTML=`<use href="#i-file"/>`;
  document.getElementById('tabbar').style.display='flex';

  // Archived banner inside content if needed
  const existingBanner=document.getElementById('arch-banner');
  if(cr.statut==='archived'){
    if(!existingBanner){
      const banner=document.createElement('div');
      banner.id='arch-banner';
      banner.style.cssText='background:var(--amber-bg);border-bottom:1px solid var(--amber);padding:8px 20px;font-size:12px;color:var(--amber);display:flex;align-items:center;gap:8px;flex-shrink:0';
      banner.innerHTML=`<svg class="ico ico-sm"><use href="#i-archive"/></svg> Ce compte rendu est archivé — il est en lecture seule dans l'historique.
        <button onclick="toggleArchiveCR('${cr.id}')" style="background:none;border:none;cursor:pointer;color:var(--blue);font-size:12px;font-family:inherit;margin-left:auto;text-decoration:underline">Désarchiver</button>`;
      const tabbar=document.getElementById('tabbar');
      tabbar.parentNode.insertBefore(banner,tabbar);
    }
  } else {
    if(existingBanner)existingBanner.remove();
  }

  // Reset tab UI
  document.querySelectorAll('.tab').forEach((t,i)=>{
    const tabs=['remarques','intervenants','actions'];
    t.classList.toggle('active',tabs[i]===activeTab);
  });

  const isArchived=cr.statut==='archived';
  document.getElementById('tb-actions').innerHTML=`
    <button class="btn btn-sm" onclick="openCRSettings('${cr.id}')">${ico('settings','ico-sm')} Réglages</button>
    <button class="btn btn-sm" onclick="saveAsTemplate('${cr.id}')" title="Enregistrer comme modèle réutilisable"><svg class="ico ico-sm"><use href="#i-save"/></svg> Modèle</button>
    <button class="btn btn-sm" onclick="previewPDF('${cr.id}')" title="Aperçu PDF avant impression"><svg class="ico ico-sm"><use href="#i-printer"/></svg> Aperçu PDF</button>
    <button class="btn btn-sm" onclick="openEditCR('${cr.id}')">${ico('edit','ico-sm')} Modifier</button>
    <button class="btn btn-sm ${isArchived?'':'btn-amber'}" onclick="toggleArchiveCR('${cr.id}')" title="${isArchived?'Désarchiver':'Archiver ce CR'}" style="${isArchived?'':'color:var(--amber);border-color:var(--amber)'}">
      <svg class="ico ico-sm"><use href="#i-archive"/></svg> ${isArchived?'Désarchiver':'Archiver'}
    </button>
    <button class="btn btn-p btn-sm" onclick="cloneCR('${cr.id}')" style="background:var(--green);border-color:var(--green);color:#fff;font-weight:600">${ico('plus','ico-sm')} CR Suivant</button>
    <button class="btn btn-sm" onclick="openAddLot('${cr.id}')">${ico('plus','ico-sm')} Lot</button>`;

  if(activeTab==='remarques') renderRemarques(cr);
  else if(activeTab==='intervenants') renderIntervenants(cr);
  else if(activeTab==='actions') renderActions(cr);
  else if(activeTab==='dates') renderDates(cr);
  else if(activeTab==='historique') renderHistorique(cr);
}

/* ══ REMARQUES ══ */
function renderRemarques(cr){
  const flagTotal=cr.lots.flatMap(l=>l.remarques).filter(r=>r.flag&&!r.done).length;
  let html=`<div style="padding:12px 20px">`;

  // Summary counts
  const all=cr.lots.flatMap(l=>l.remarques);
  const openR=all.filter(r=>!r.done&&!r.archived);
  const flagR=all.filter(r=>r.flag&&!r.archived);
  const doneR=all.filter(r=>r.done&&!r.archived);
  const archR=all.filter(r=>r.archived);
  const actCount=cr.actions.filter(a=>!a.done).length;
  const lateActCount=cr.actions.filter(a=>!a.done&&isLate(a.echeance)).length;

  html+=`
  <!-- KPI strip -->
  <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:stretch">
    <div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:8px 14px;display:flex;align-items:center;gap:8px;min-width:80px">
      <div style="font-size:22px;font-weight:700;color:var(--text)">${all.length}</div>
      <div style="font-size:10px;color:var(--text3);line-height:1.3">Points<br>total</div>
    </div>
    <div style="background:var(--amber-bg);border:1px solid ${flagR.length?'var(--amber)':'var(--border)'};border-radius:var(--r);padding:8px 14px;display:flex;align-items:center;gap:8px;min-width:80px">
      <div style="font-size:22px;font-weight:700;color:var(--amber)">${flagR.length}</div>
      <div style="font-size:10px;color:var(--amber);line-height:1.3">A<br>suivre</div>
    </div>
    <div style="background:${openR.length?'#fff5f5':'var(--panel)'};border:1px solid ${openR.length?'#f5b8b8':'var(--border)'};border-radius:var(--r);padding:8px 14px;display:flex;align-items:center;gap:8px;min-width:80px">
      <div style="font-size:22px;font-weight:700;color:${openR.length?'#c0392b':'var(--text3)'}">${openR.length}</div>
      <div style="font-size:10px;color:${openR.length?'#c0392b':'var(--text3)'};line-height:1.3">Non<br>traites</div>
    </div>
    <div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:8px 14px;display:flex;align-items:center;gap:8px;min-width:80px">
      <div style="font-size:22px;font-weight:700;color:var(--text)">${actCount}</div>
      <div style="font-size:10px;color:var(--text3);line-height:1.3">Actions<br>en cours</div>
    </div>
    ${lateActCount?`<div style="background:#fff5f5;border:1px solid #f5b8b8;border-radius:var(--r);padding:8px 14px;display:flex;align-items:center;gap:8px;min-width:80px">
      <div style="font-size:22px;font-weight:700;color:#c0392b">${lateActCount}</div>
      <div style="font-size:10px;color:#c0392b;line-height:1.3">Actions<br>en retard</div>
    </div>`:''}
    ${cr.dateProchaine?`<div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:8px 14px;display:flex;align-items:center;gap:8px">
      <div style="font-size:11px;color:var(--text3)">Prochaine reunion<br><strong style="color:var(--text);font-size:13px">${cr.dateProchaine}</strong></div>
    </div>`:''}
    <div style="display:flex;flex-direction:column;gap:4px;justify-content:center;margin-left:auto">
      <button class="btn btn-sm" onclick="exportCSV('${cr.id}')" title="CSV"><svg class="ico ico-xs"><use href="#i-download"/></svg></button>
      <button class="btn btn-sm" onclick="toggleSortLots('${cr.id}')" title="${lotsSortedByFlags?'Ordre original':'Trier par urgence'}"><svg class="ico ico-xs"><use href="#i-flag"/></svg></button>
    </div>
  </div>

  <!-- Quick filter bar -->
  <div style="display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;align-items:center">
    ${[
      ['all','Tous',all.length,'var(--text2)','var(--bg2)'],
      ['flag','⚑ À suivre',flagR.length,'var(--amber)','var(--amber-bg)'],
      ['open','Non traités',openR.length,'var(--text2)','var(--bg2)'],
      ['done','Traités',doneR.length,'var(--green)','var(--green-bg)'],
      ['action','Actions',actCount,'var(--blue)','var(--blue-bg)'],
    ].map(([k,label,count,col,bg])=>`
      <button onclick="quickFilter='${k}';renderRemarques(CRS.find(c=>c.id==='${cr.id}'))"
        style="padding:5px 12px;border-radius:20px;border:1.5px solid ${quickFilter===k?col:'var(--border)'};background:${quickFilter===k?bg:'transparent'};color:${quickFilter===k?col:'var(--text3)'};font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s">
        ${label} <span style="font-size:10px;opacity:.8">${count}</span>
      </button>`).join('')}
    <div style="flex:1;min-width:120px;display:flex;align-items:center;gap:6px;background:var(--bg2);border-radius:20px;padding:5px 10px;margin-left:4px">
      <svg class="ico ico-xs" style="color:var(--text3)"><use href="#i-search"/></svg>
      <input placeholder="Rechercher…" id="remarque-search" value="${remarqueSearch}"
        oninput="remarqueSearch=this.value;renderRemarques(CRS.find(c=>c.id==='${cr.id}'))"
        style="border:none;background:none;outline:none;font-size:12px;color:var(--text);width:100%;font-family:inherit">
      ${remarqueSearch?`<button onclick="remarqueSearch='';renderRemarques(CRS.find(c=>c.id==='${cr.id}'))" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:12px">✕</button>`:''}
    </div>
  </div>`;

  cr.lots.forEach(lot=>{
    // Color priority: linked intervenant > lot's own color > derived from title
    const linked=lot.intId?cr.intervenants.find(i=>i.id===lot.intId):null;
    const color=getColor(lot,cr);
    const linkedLabel=linked?(linked.entreprise||linked.lot):null;
    const lotArchived=lot.remarques.filter(r=>r.archived).length;
    const lotFlags=lot.remarques.filter(r=>r.flag&&!r.archived).length;
    const lotOpen=lot.remarques.filter(r=>!r.done&&!r.archived).length;
    // Backward compat
    const lotDone=lotArchived;
    html+=`<div class="lot-block" data-lotid="${lot.id}">

          <div class="lot-title">${lot.titre}</div>
          ${lotFlags?`<span class="badge bamber" style="font-size:9px">${lotFlags} ⚑</span>`:''}
          ${linkedLabel?`<span class="lot-int-badge" style="font-size:10px;color:${color};background:${color}18;padding:2px 7px;border-radius:10px;font-weight:500">${linkedLabel}</span>`:''}

        <div style="display:flex;align-items:center;gap:6px">

          <button class="btn-g" style="padding:3px" onclick="event.stopPropagation();renameLot('${cr.id}','${lot.id}')" title="Renommer">${ico('edit','ico-xs')}</button>
          <button class="btn-g" style="padding:3px" onclick="event.stopPropagation();deleteLot('${cr.id}','${lot.id}')" title="Supprimer le lot"><svg class="ico ico-xs" style="color:var(--red)"><use href="#i-trash"/></svg></button>
          ${ico(lot.ouvert?'chevron-up':'chevron-down','ico-sm')}
        </div>
      </div>
      ${lot.ouvert?`<div class="lot-body">
        ${(()=>{
          // Apply quickFilter + search
          let active=lot.remarques.filter(r=>!r.archived);
          if(remarqueSearch) active=active.filter(r=>r.texte.toLowerCase().includes(remarqueSearch.toLowerCase()));
          if(quickFilter==='flag') active=active.filter(r=>r.flag);
          else if(quickFilter==='open') active=active.filter(r=>!r.done);
          else if(quickFilter==='done') active=active.filter(r=>r.done);
          else if(quickFilter==='action') active=[];// actions shown in Actions tab

          // Sort: flags first, then open, then done
          active.sort((a,b)=>{
            const scoreA=(a.flag&&!a.done)?2:(!a.done)?1:0;
            const scoreB=(b.flag&&!b.done)?2:(!b.done)?1:0;
            return scoreB-scoreA;
          });

          const archived=lot.remarques.filter(r=>r.archived);
          const archId='arch-'+lot.id;
          let out='';

          if(active.length===0&&quickFilter!=='all'){
            out+='<div style="padding:10px 0;font-size:12px;color:var(--text3);text-align:center">Aucun point pour ce filtre</div>';
          }

          out+=active.map(r=>{
            // Status badge
            const badge=r.flag&&!r.done
              ?'<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--amber-bg);color:var(--amber);white-space:nowrap;flex-shrink:0">⚑ À suivre</span>'
              :r.decision&&!r.done
              ?'<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--purple-bg);color:var(--purple);white-space:nowrap;flex-shrink:0">🔷 Décision</span>'
              :r.done
              ?'<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--green-bg);color:var(--green);white-space:nowrap;flex-shrink:0">✓ Traité</span>'
              :'';
            // Image thumbnails
            const imgGrid=(r.images&&r.images.length)?`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px">${r.images.map(img=>`
              <div style="position:relative;border-radius:5px;overflow:hidden;border:1px solid var(--border)">
                <img src="${img.data}" style="width:80px;height:60px;object-fit:cover;display:block" title="${e(img.caption||img.name)}">
                ${img.caption?`<div style="padding:2px 4px;font-size:9px;color:var(--text3);background:var(--bg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px">${e(img.caption)}</div>`:''}
                <button onclick="deleteImage('${cr.id}','${lot.id}','${r.id}','${img.id}')" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);border:none;color:#fff;border-radius:50%;width:16px;height:16px;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">x</button>
              </div>`).join('')}</div>`:'';
            return `<div class="remarque-item" style="${r.done?'opacity:.65':''}${r.flag&&!r.done?';border-left:2px solid var(--amber);padding-left:8px;margin-left:-2px':''}">
              <div class="ri-check ${r.done?'done':r.flag?'flagged':''}" onclick="toggleDone('${cr.id}','${lot.id}','${r.id}')" title="${r.done?'Décocher':'Marquer traité'}" style="flex-shrink:0">
                ${r.done?ico('check','ico-xs'):''}
              </div>
              <div style="flex:1;min-width:0">
                <div class="ri-text ${r.done?'done-text':''}" style="line-height:1.4">${r.texte}</div>
                <div style="margin-top:3px;display:flex;gap:4px;align-items:center;flex-wrap:wrap">
                  ${badge}
                  ${r.doneAt&&r.done?'<span style="font-size:9px;color:var(--text3)">'+r.doneAt+'</span>':''}
                </div>
                ${imgGrid}
              </div>
              <!-- Context menu "…" -->
              <div class="ri-actions" style="position:relative">
                <button class="btn-g" style="padding:4px 6px;font-size:14px;font-weight:700;color:var(--text3);line-height:1" onclick="toggleRemarqueMenu(event,'rmenu-${r.id}')" title="Plus d\'actions">…</button>
                <div id="rmenu-${r.id}" style="display:none;position:absolute;right:0;top:24px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow2);z-index:50;min-width:180px;padding:4px 0">
                  ${!r.done?`<button onclick="toggleFlag('${cr.id}','${lot.id}','${r.id}');closeAllMenus()" style="width:100%;text-align:left;padding:7px 14px;border:none;background:none;cursor:pointer;font-size:12px;font-family:inherit;color:${r.flag?'var(--amber)':'var(--text2)'}">
                    ${r.flag?'⚑ Retirer le marquage':'⚑ Marquer à suivre'}
                  </button>`:''}
                  ${!r.done?`<button onclick="toggleDone('${cr.id}','${lot.id}','${r.id}');closeAllMenus()" style="width:100%;text-align:left;padding:7px 14px;border:none;background:none;cursor:pointer;font-size:12px;font-family:inherit;color:var(--green)">
                    ✓ Marquer traité
                  </button>`:''}
                  ${r.done?`<button onclick="archiveRemarque('${cr.id}','${lot.id}','${r.id}');closeAllMenus()" style="width:100%;text-align:left;padding:7px 14px;border:none;background:none;cursor:pointer;font-size:12px;font-family:inherit">
                    Archiver
                  </button>`:''}
                  <button onclick="editRemarque('${cr.id}','${lot.id}','${r.id}');closeAllMenus()" style="width:100%;text-align:left;padding:7px 14px;border:none;background:none;cursor:pointer;font-size:12px;font-family:inherit">
                    Modifier la remarque
                  </button>
                  <button onclick="openAddImage('${cr.id}','${lot.id}','${r.id}');closeAllMenus()" style="width:100%;text-align:left;padding:7px 14px;border:none;background:none;cursor:pointer;font-size:12px;font-family:inherit">
                    Ajouter une image
                  </button>
                  ${!r.done?`<button onclick="copyRemarque('${cr.id}','${lot.id}','${r.id}');closeAllMenus()" style="width:100%;text-align:left;padding:7px 14px;border:none;background:none;cursor:pointer;font-size:12px;font-family:inherit">
                    Copier dans un autre lot
                  </button>`:''}
                  ${!r.done?`<button onclick="remarkToAction('${cr.id}','${lot.id}','${r.id}');closeAllMenus()" style="width:100%;text-align:left;padding:7px 14px;border:none;background:none;cursor:pointer;font-size:12px;font-family:inherit">
                    Convertir en action
                  </button>`:''}
                  <div style="height:1px;background:var(--border);margin:3px 0"></div>
                  <button onclick="deleteRemarque('${cr.id}','${lot.id}','${r.id}');closeAllMenus()" style="width:100%;text-align:left;padding:7px 14px;border:none;background:none;cursor:pointer;font-size:12px;font-family:inherit;color:var(--red)">
                    Supprimer
                  </button>
                </div>
              </div>
            </div>`;
          }).join('');

          if(archived.length){
            out+=`<div style="margin-top:8px;border-top:1px dashed var(--border2)">
              <button onclick="var el=document.getElementById('${archId}');el.style.display=el.style.display==='none'?'block':'none'" style="display:flex;align-items:center;gap:6px;padding:6px 0;border:none;background:none;cursor:pointer;font-family:inherit;font-size:11px;font-weight:600;color:var(--text3);width:100%">
                <svg class="ico ico-xs"><use href="#i-archive"/></svg> Archive — ${archived.length} point(s) archivés ▸
              </button>
              <div id="${archId}" style="display:none">
                ${archived.map(r=>`
                <div class="remarque-item" style="opacity:.6;background:var(--green-bg)">
                  <div class="ri-check done" onclick="unarchiveRemarque('${cr.id}','${lot.id}','${r.id}')" title="Remettre visible">${ico('check','ico-xs')}</div>
                  <div style="flex:1;min-width:0">
                    <div class="ri-text done-text">${r.texte}</div>
                    ${r.archivedAt?`<div style="font-size:10px;color:var(--green);margin-top:2px">🗄 Archivé le ${r.archivedAt}</div>`:''}
                  </div>
                  <button class="btn-g" style="padding:3px" onclick="deleteRemarque('${cr.id}','${lot.id}','${r.id}')" title="Supprimer définitivement"><svg class="ico ico-xs" style="color:var(--red)"><use href="#i-trash"/></svg></button>
                </div>`).join('')}
              </div>
            </div>`;
          }
          return out;
        })()}
        <!-- Quick add with type selector -->
        <div style="padding:8px 0 2px;border-top:1px solid var(--border);margin-top:8px">
          <div style="display:flex;gap:4px;margin-bottom:5px;flex-wrap:wrap">
            ${[['remarque','💬','Remarque','var(--text2)'],['flag','⚑','À suivre','var(--amber)'],['action','⚡','Action','var(--blue)'],['decision','🔷','Décision','var(--purple)']].map(([t,icon,label,col])=>`
            <button id="qtype-${lot.id}-${t}" onclick="setQuickType('${lot.id}','${t}')"
              style="font-size:10px;padding:3px 9px;border-radius:12px;border:1.5px solid ${col};background:transparent;color:${col};cursor:pointer;font-family:inherit;font-weight:600;opacity:.5;transition:all .12s">
              ${icon} ${label}
            </button>`).join('')}
          </div>
          <div style="display:flex;gap:6px">
            <input placeholder="Ajouter une remarque…" id="new-r-${lot.id}"
              style="flex:1;padding:6px 9px;border:1px solid var(--border2);border-radius:7px;font-size:12px;background:var(--bg);color:var(--text);outline:none;font-family:inherit"
              onfocus="setQuickType('${lot.id}','remarque')"
              onkeydown="if(event.key==='Enter')addRemarque('${cr.id}','${lot.id}')">
            <button class="btn btn-p btn-sm" onclick="addRemarque('${cr.id}','${lot.id}')">${ico('plus','ico-xs')}</button>
          </div>
        </div>
      </div>`:``}
    </div>`;
  });
  html+='</div>';
  document.getElementById('content').innerHTML=html;
}

/* ══ INTERVENANTS ══ */
function renderIntervenants(cr){
  const present=cr.intervenants.filter(i=>i.present);
  const absent=cr.intervenants.filter(i=>!i.present);
  document.getElementById('content').innerHTML=`<div style="padding:16px 24px">
    <div style="display:flex;gap:8px;margin-bottom:14px;align-items:center">
      <span style="font-size:13px;font-weight:500">${cr.intervenants.length} intervenants</span>
      <span class="badge bgreen">${present.length} présents</span>
      <span class="badge bgray">${absent.length} absents</span>
      <button class="btn btn-sm" style="margin-left:auto" onclick="openAddIntervenant('${cr.id}')">${ico('plus','ico-sm')} Ajouter</button>
    </div>
    <div class="int-grid">
      ${cr.intervenants.map((i,idx)=>`
        <div class="int-card" data-intidx="${idx}" style="border-left:3px solid ${getColor(i,cr)}">
          <div class="int-lot">${i.lot}</div>
          <div class="int-ent">${i.entreprise||i.lot}</div>
          <div class="int-contact" style="white-space:pre-line">${i.contacts||'—'}</div>
          <div style="margin-top:8px;display:flex;align-items:center;flex-wrap:wrap;gap:4px">
            <span class="badge ${i.convoque!==false?'bblue':'bgray'}" style="font-size:9px;cursor:pointer" onclick="toggleConvoque('${cr.id}','${i.id}')" title="Convoqué à cette réunion">${i.convoque!==false?'📩 Convoqué':'Non convoqué'}</span>
            <span class="badge ${i.present?'bgreen':'bgray'}" style="font-size:9px;cursor:pointer" onclick="togglePresence('${cr.id}','${i.lot}')">${i.present?'✓ Présent':'Absent'}</span>
            <div style="display:flex;gap:3px;margin-left:auto">
              <button class="btn-g" style="padding:3px" onclick="editIntervenant('${cr.id}',${idx})" title="Modifier">${ico('edit','ico-xs')}</button>
              <button class="btn-g" style="padding:3px" onclick="deleteIntervenant('${cr.id}',${idx})" title="Supprimer"><svg class="ico ico-xs" style="color:var(--red)"><use href="#i-trash"/></svg></button>
            </div>
          </div>
        </div>`).join('')}
    </div>
  </div>`;
}

/* ══ ACTIONS ══ */
function renderActions(cr){
  // Status filter first
  const allActions=cr.actions;
  const lateActions=allActions.filter(a=>!a.done&&isLate(a.echeance));
  const soonActions=allActions.filter(a=>!a.done&&isSoon(a.echeance));

  // Status filter
  let filteredActions=allActions;
  if(actionStatusFilter==='late') filteredActions=allActions.filter(a=>!a.done&&isLate(a.echeance));
  else if(actionStatusFilter==='soon') filteredActions=allActions.filter(a=>!a.done&&isSoon(a.echeance));
  else if(actionStatusFilter==='open') filteredActions=allActions.filter(a=>!a.done);
  else if(actionStatusFilter==='done') filteredActions=allActions.filter(a=>a.done);

  // Then by-intervenant filter on top
  if(actionFilter) filteredActions=filteredActions.filter(a=>a.intId===actionFilter);

  const todo=filteredActions.filter(a=>!a.done);
  const done=filteredActions.filter(a=>a.done);
  const allTodo=allActions.filter(a=>!a.done);
  const allDone=allActions.filter(a=>a.done);

  // Status quick filters
  const statusFilters=[
    ['all','Toutes',allActions.length,'var(--text2)'],
    ['late','⚠ En retard',lateActions.length,'var(--red)'],
    ['soon','⏰ Avant prochaine réunion',soonActions.length,'var(--amber)'],
    ['open','En cours',allTodo.length,'var(--text2)'],
    ['done','Terminées',allDone.length,'var(--green)'],
  ].map(([k,label,count,col])=>`
    <button onclick="actionStatusFilter='${k}';renderActions(CRS.find(c=>c.id==='${cr.id}'))"
      style="padding:4px 11px;border-radius:16px;border:1.5px solid ${actionStatusFilter===k?col:'var(--border)'};background:${actionStatusFilter===k?col+'18':'transparent'};color:${actionStatusFilter===k?col:'var(--text3)'};font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">
      ${label} <span style="opacity:.7">${count}</span>
    </button>`).join('');

  // Intervenant chips (secondary filter)
  const intervenantIds=[...new Set(cr.actions.map(a=>a.intId).filter(Boolean))];
  const filterChips=intervenantIds.map(intId=>{
    const iv=cr.intervenants.find(i=>i.id===intId);
    if(!iv)return '';
    const col=getColor(iv,cr);
    const active=actionFilter===intId;
    return `<button onclick="actionFilter='${active?'':intId}';renderActions(CRS.find(c=>c.id==='${cr.id}'))"
      style="font-size:10px;padding:2px 9px;border-radius:10px;border:1.5px solid ${col};background:${active?col:'transparent'};color:${active?'#fff':col};cursor:pointer;font-family:inherit;font-weight:600">
      ${iv.entreprise||iv.lot}
    </button>`;
  }).join('');

  function actionCard(a,isDone){
    const linked=a.intId?cr.intervenants.find(i=>i.id===a.intId):null;
    const linkedLabel=linked?(linked.entreprise||linked.lot):a.responsable;
    const linkedColor=linked?getColor(linked,cr):'var(--text3)';
    const late=!isDone&&isLate(a.echeance);
    const soon=!isDone&&!late&&isSoon(a.echeance);
    const statusBg=isDone?'var(--green-bg)':late?'var(--red-bg)':soon?'var(--amber-bg)':'var(--bg2)';
    const statusColor=isDone?'var(--green)':late?'var(--red)':soon?'var(--amber)':'var(--text3)';
    const imgGrid=(a.images&&a.images.length)?`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px">${a.images.map(img=>`
      <div style="position:relative;border-radius:5px;overflow:hidden;border:1px solid var(--border)">
        <img src="${img.data}" style="width:80px;height:60px;object-fit:cover;display:block" title="${e(img.caption||img.name)}">
        ${img.caption?`<div style="padding:2px 4px;font-size:9px;color:var(--text3);background:var(--bg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px">${e(img.caption)}</div>`:''}
        <button onclick="deleteActionImage('${cr.id}','${a.id}','${img.id}')" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);border:none;color:#fff;border-radius:50%;width:16px;height:16px;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">x</button>
      </div>`).join('')}</div>`:'';
    return `<div class="action-row ${isDone?'done':''}" style="${late?'border-left:3px solid var(--red)':soon?'border-left:3px solid var(--amber)':''}">
      <div class="ar-status" style="background:${statusBg};color:${statusColor};cursor:pointer" onclick="toggleAction('${cr.id}','${a.id}')">
        ${isDone?ico('check','ico-xs'):late?'!':soon?'~':ico('alert','ico-xs')}
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;${isDone?'text-decoration:line-through;color:var(--text3)':''}">${a.texte}</div>
        <div style="font-size:11px;margin-top:3px;display:flex;gap:7px;align-items:center;flex-wrap:wrap">
          ${linkedLabel?`<span style="font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;background:${linkedColor}18;color:${linkedColor}">${linkedLabel}</span>`:''}
          ${a.echeance?`<span style="color:${late?'var(--red)':soon?'var(--amber)':'var(--text3)'};font-weight:${late||soon?'600':'400'}">${ico('calendar','ico-xs')} ${a.echeance}${late?' EN RETARD':soon?' Bientot':''}</span>`:''}
        </div>
        ${imgGrid}
      </div>
      <div style="display:flex;gap:3px;flex-shrink:0">
        <button class="btn-g" style="padding:3px" onclick="openAddActionImage('${cr.id}','${a.id}')" title="Ajouter une image"><svg class="ico ico-xs"><use href="#i-upload"/></svg></button>
        <button class="btn-g" style="padding:3px" onclick="editAction('${cr.id}','${a.id}')" title="Modifier">${ico('edit','ico-xs')}</button>
        <button class="btn-g" style="padding:3px" onclick="deleteAction('${cr.id}','${a.id}')" title="Supprimer"><svg class="ico ico-xs" style="color:var(--red)"><use href="#i-trash"/></svg></button>
      </div>
    </div>`;
  }

  document.getElementById('content').innerHTML=`<div style="padding:12px 20px">
    <!-- Header -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="display:flex;gap:8px;align-items:center">
        <span style="font-size:13px;font-weight:600">${allActions.length} actions</span>
        ${lateActions.length?`<span class="badge bred">⚠ ${lateActions.length} en retard</span>`:''}
        ${soonActions.length?`<span class="badge bamber">⏰ ${soonActions.length} bientôt</span>`:''}
      </div>
      <button class="btn btn-p btn-sm" onclick="openAddAction('${cr.id}')">${ico('plus','ico-sm')} Ajouter</button>
    </div>

    <!-- Status quick filters -->
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">
      ${statusFilters}
    </div>

    <!-- Intervenant chips -->
    ${filterChips?`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)">${filterChips}</div>`:''}

    ${todo.length?`<div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">En cours (${todo.length})</div>`:''}
    ${todo.map(a=>actionCard(a,false)).join('')}

    ${done.length?`<div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px">Terminées (${done.length})</div>`:''}
    ${done.map(a=>actionCard(a,true)).join('')}

    ${!allActions.length?`<div style="text-align:center;padding:40px;color:var(--text3)">
      <svg class="ico" style="width:36px;height:36px;display:block;margin:0 auto 10px"><use href="#i-check"/></svg>
      Aucune action pour ce CR
    </div>`:''}
    ${allActions.length&&todo.length===0&&done.length===0&&(actionFilter||actionStatusFilter!=='all')?`<div style="text-align:center;padding:30px;color:var(--text3);font-size:13px">Aucune action pour ce filtre</div>`:''}
  </div>`;
}

/* ══ DATES ══ */
function renderDates(cr){
  // Collect all remarques with dates across all lots
  const rows=[];
  cr.lots.forEach(function(lot){
    const color=getColor(lot,cr);
    const linked=lot.intId?cr.intervenants.find(function(i){return i.id===lot.intId;}):null;
    lot.remarques.forEach(function(r){
      rows.push({r:r,lot:lot,color:color,linked:linked});
    });
  });

  if(!rows.length){
    document.getElementById('content').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text3);font-size:13px">Aucune remarque</div>';
    return;
  }

  // Sort: active first (by createdAt desc), then archived (by archivedAt desc)
  const active=rows.filter(function(x){return !x.r.archived;});
  const archived=rows.filter(function(x){return x.r.archived;});

  function dateSort(a,b){
    const da=a.r.createdAt||'';const db=b.r.createdAt||'';
    // dd/mm/yyyy → sort descending
    const pa=da.split('/');const pb=db.split('/');
    const ta=pa.length===3?new Date(pa[2],pa[1]-1,pa[0]).getTime():0;
    const tb=pb.length===3?new Date(pb[2],pb[1]-1,pb[0]).getTime():0;
    return tb-ta;
  }
  active.sort(dateSort);
  archived.sort(function(a,b){
    const da=a.r.archivedAt||'';const db=b.r.archivedAt||'';
    const pa=da.split('/');const pb=db.split('/');
    const ta=pa.length===3?new Date(pa[2],pa[1]-1,pa[0]).getTime():0;
    const tb=pb.length===3?new Date(pb[2],pb[1]-1,pb[0]).getTime():0;
    return tb-ta;
  });

  function tableRow(x,isArchived){
    const r=x.r;const lot=x.lot;const color=x.color;const linked=x.linked;
    return '<tr style="'+(isArchived?'opacity:.6;background:var(--green-bg)':'')+'">'
      +'<td style="padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top;white-space:nowrap">'
        +'<span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;background:'+color+'18;color:'+color+'">'+(linked?linked.entreprise||linked.lot:lot.titre)+'</span>'
      +'</td>'
      +'<td style="padding:8px 10px;border-bottom:1px solid var(--border);font-size:12.5px;vertical-align:top">'
        +(isArchived?'<span style="text-decoration:line-through;color:var(--text3)">'+e(r.texte)+'</span>':e(r.texte))
        +(r.flag?'<span style="margin-left:6px;color:var(--amber);font-size:10px;font-weight:600">⚑</span>':'')
      +'</td>'
      +'<td style="padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:top">'
        +'<div style="font-size:11px;color:var(--text3)">'+(r.createdAt||'—')+'</div>'
        +(isArchived&&r.archivedAt?'<div style="font-size:10px;color:var(--green);margin-top:2px">✓ '+r.archivedAt+'</div>':'')
      +'</td>'
      +'<td style="padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:top;text-align:center">'
        +(isArchived
          ?'<button class="btn-g" style="padding:2px" onclick="toggleDone(\''+cr.id+'\',\''+lot.id+'\',\''+r.id+'\')" title="Remettre en cours"><svg class="ico ico-xs" style="color:var(--green)"><use href="#i-check"/></svg></button>'
          :'<button class="btn-g" style="padding:2px" onclick="toggleDone(\''+cr.id+'\',\''+lot.id+'\',\''+r.id+'\')" title="Archiver"><svg class="ico ico-xs" style="color:var(--text3)"><use href="#i-archive"/></svg></button>'
        )
        +'<button class="btn-g" style="padding:2px" onclick="editRemarque(\''+cr.id+'\',\''+lot.id+'\',\''+r.id+'\')" title="Modifier"><svg class="ico ico-xs"><use href="#i-edit"/></svg></button>'
      +'</td>'
    +'</tr>';
  }

  const activeCount=active.length;
  const archivedCount=archived.length;
  const crDate=cr.date||'—';

  document.getElementById('content').innerHTML=''
    +'<div style="padding:16px 24px">'

    // Header stats
    +'<div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center">'
      +'<div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:8px 14px;display:flex;gap:8px;align-items:center">'
        +'<span style="font-size:18px;font-weight:600;color:var(--text)">'+rows.length+'</span>'
        +'<span style="font-size:11px;color:var(--text3)">points total</span>'
      +'</div>'
      +'<div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:8px 14px;display:flex;gap:8px;align-items:center">'
        +'<span style="font-size:18px;font-weight:600;color:var(--red)">'+activeCount+'</span>'
        +'<span style="font-size:11px;color:var(--text3)">en cours</span>'
      +'</div>'
      +'<div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:8px 14px;display:flex;gap:8px;align-items:center">'
        +'<span style="font-size:18px;font-weight:600;color:var(--green)">'+archivedCount+'</span>'
        +'<span style="font-size:11px;color:var(--text3)">traités</span>'
      +'</div>'
      +'<div style="font-size:11px;color:var(--text3);margin-left:auto">CR du '+crDate+'</div>'
    +'</div>'

    // Active table
    +(activeCount?''
      +'<div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Points en cours ('+activeCount+')</div>'
      +'<div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:20px">'
        +'<table style="width:100%;border-collapse:collapse">'
          +'<thead><tr style="background:var(--bg2)">'
            +'<th style="padding:7px 10px;text-align:left;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap">Lot</th>'
            +'<th style="padding:7px 10px;text-align:left;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)">Remarque</th>'
            +'<th style="padding:7px 10px;text-align:left;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap">Ajouté le</th>'
            +'<th style="padding:7px 10px;text-align:center;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap">Action</th>'
          +'</tr></thead>'
          +'<tbody>'+active.map(function(x){return tableRow(x,false);}).join('')+'</tbody>'
        +'</table>'
      +'</div>'
    :'')

    // Archived table
    +(archivedCount?''
      +'<div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Points traités / archivés ('+archivedCount+')</div>'
      +'<div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r);overflow:hidden">'
        +'<table style="width:100%;border-collapse:collapse">'
          +'<thead><tr style="background:var(--bg2)">'
            +'<th style="padding:7px 10px;text-align:left;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap">Lot</th>'
            +'<th style="padding:7px 10px;text-align:left;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)">Remarque</th>'
            +'<th style="padding:7px 10px;text-align:left;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap">Ajouté / Traité le</th>'
            +'<th style="padding:7px 10px;text-align:center;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)">Action</th>'
          +'</tr></thead>'
          +'<tbody>'+archived.map(function(x){return tableRow(x,true);}).join('')+'</tbody>'
        +'</table>'
      +'</div>'
    :'')

    +'</div>';
}

/* ══ HISTORIQUE ══ */
function renderHistorique(currentCR){
  // Find all CRs for the same project, sorted by numero
  const siblings=CRS
    .filter(c=>c.projet===currentCR.projet)
    .sort((a,b)=>a.numero-b.numero);

  if(siblings.length<=1 && CRS.length===1){
    document.getElementById('content').innerHTML=`
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--text3)">
        <svg class="ico" style="width:38px;height:38px"><use href="#i-calendar"/></svg>
        <div style="font-weight:500">Aucun autre compte rendu</div>
        <div style="font-size:12px">Créez un nouveau CR pour voir l'historique</div>
        <button class="btn btn-p btn-sm" onclick="openNewCR()">${ico('plus','ico-sm')} Nouveau CR</button>
      </div>`;
    return;
  }

  // Stats per CR
  function crStats(cr){
    const all=cr.lots.flatMap(l=>l.remarques);
    const done=all.filter(r=>r.archived).length;
    const flags=all.filter(r=>r.flag&&!r.archived).length;
    const actTodo=cr.actions.filter(a=>!a.done).length;
    const actDone=cr.actions.filter(a=>a.done).length;
    return {total:all.length,done,flags,actTodo,actDone};
  }

  const html=`<div style="padding:20px 28px;max-width:800px">
    <div style="font-size:13px;font-weight:500;margin-bottom:18px;color:var(--text2)">
      ${siblings.length} compte${siblings.length>1?'s':''} rendu${siblings.length>1?'s':''} — ${currentCR.projet}
    </div>

    <!-- Timeline -->
    <div style="position:relative">
      <!-- vertical line -->
      <div style="position:absolute;left:20px;top:0;bottom:0;width:2px;background:var(--border);border-radius:1px"></div>

      ${siblings.map((cr,idx)=>{
        const s=crStats(cr);
        const isCurrent=cr.id===currentCR.id;
        const isArchived=cr.statut==='archived';
        const pct=s.total>0?Math.round(s.done/s.total*100):0;

        return `<div style="display:flex;gap:16px;margin-bottom:18px;position:relative">
          <!-- Timeline dot -->
          <div style="width:40px;flex-shrink:0;display:flex;justify-content:center;padding-top:10px;position:relative;z-index:1">
            <div style="width:14px;height:14px;border-radius:50%;border:2.5px solid ${isCurrent?'var(--blue)':isArchived?'var(--amber)':'var(--border2)'};background:${isCurrent?'var(--blue)':isArchived?'var(--amber-bg)':'var(--panel)'}"></div>
          </div>

          <!-- Card -->
          <div onclick="jumpToCR('${cr.id}')" style="flex:1;background:${isCurrent?'var(--blue-bg)':'var(--panel)'};border:${isCurrent?'1.5px solid var(--blue-lt)':'1px solid var(--border)'};border-radius:var(--r2);padding:14px 16px;cursor:pointer;transition:all .15s" onmouseover="this.style.borderColor='var(--blue-lt)'" onmouseout="this.style.borderColor='${isCurrent?'var(--blue-lt)':'var(--border)'}'">

            <!-- Header -->
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px">
              <div>
                <div style="display:flex;align-items:center;gap:7px;margin-bottom:2px">
                  <span style="font-weight:600;font-size:13.5px;color:${isCurrent?'var(--blue)':'var(--text)'}">CR n°${cr.numero}</span>
                  ${isCurrent?`<span class="badge bblue" style="font-size:9px">En cours</span>`:''}
                  ${isArchived?`<span class="badge bamber" style="font-size:9px">Archivé</span>`:''}
                </div>
                <div style="font-size:12px;font-weight:500;color:var(--text2)">${cr.date}</div>
                ${cr.dateProchaine?`<div style="font-size:11px;color:var(--text3);margin-top:1px">Prochaine réunion : ${cr.dateProchaine}</div>`:''}
                ${cr.redacteur?`<div style="font-size:11px;color:var(--text3)">Rédacteur : ${cr.redacteur}</div>`:''}
              </div>
              <div style="text-align:right;flex-shrink:0">
                <div style="font-size:20px;font-weight:700;color:${isCurrent?'var(--blue)':pct===100?'var(--green)':'var(--text2)'}">${pct}%</div>
                <div style="font-size:10px;color:var(--text3)">traité</div>
              </div>
            </div>

            <!-- Progress bar -->
            <div style="height:4px;background:var(--bg2);border-radius:2px;overflow:hidden;margin-bottom:10px">
              <div style="height:100%;border-radius:2px;background:${pct===100?'var(--green)':isCurrent?'var(--blue)':'var(--border2)'};width:${pct}%;transition:width .3s"></div>
            </div>

            <!-- Stats row -->
            <div style="display:flex;gap:10px;flex-wrap:wrap">
              <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)">
                <svg class="ico ico-xs"><use href="#i-file"/></svg>
                <span>${s.done}/${s.total} points</span>
              </div>
              ${s.flags?`<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--amber)">
                <svg class="ico ico-xs"><use href="#i-flag"/></svg>
                <span>${s.flags} à suivre</span>
              </div>`:''}
              <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)">
                <svg class="ico ico-xs"><use href="#i-check"/></svg>
                <span>${s.actDone}/${s.actTodo+s.actDone} actions</span>
              </div>
              <div style="margin-left:auto">
                <span style="font-size:11px;color:${isCurrent?'var(--blue)':'var(--text3)'};font-weight:500">${isCurrent?'Vue actuelle →':'Ouvrir →'}</span>
              </div>
            </div>

            <!-- Lots summary (only show if not too many) -->
            ${s.flags>0?`<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:5px">
              ${cr.lots.filter(l=>l.remarques.some(r=>r.flag&&!r.archived)).map(l=>`
                <span style="font-size:10px;padding:2px 7px;border-radius:10px;background:${getColor(l,cr)}18;color:${getColor(l,cr)}">${l.titre}</span>
              `).join('')}
            </div>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>

    <!-- New CR button -->
    <div style="display:flex;justify-content:center;margin-top:8px;padding-left:56px">

/* ══ LOT & REMARQUE ACTIONS ══ */
function toggleLot(crId,lotId){
  const cr=CRS.find(c=>c.id===crId);
  const lot=cr?.lots.find(l=>l.id===lotId);
  if(lot)lot.ouvert=!lot.ouvert;
  renderCR();
}
function toggleDone(crId,lotId,rId){
  const cr=CRS.find(c=>c.id===crId);
  const lot=cr?.lots.find(l=>l.id===lotId);
  const r=lot?.remarques.find(x=>x.id===rId);
  if(r){
    r.done=!r.done;
    if(r.done){
      r.flag=false;
      r.doneAt=new Date().toLocaleDateString('fr-FR');
    } else {
      r.doneAt=null;
    }
    // If un-checking, also un-archive
    if(!r.done) r.archived=false;
  }
  markDirty();renderCR();renderList();
}
function archiveRemarque(crId,lotId,rId){
  const cr=CRS.find(c=>c.id===crId);
  const lot=cr?.lots.find(l=>l.id===lotId);
  const r=lot?.remarques.find(x=>x.id===rId);
  if(r){
    r.archived=true;
    r.archivedAt=r.doneAt||new Date().toLocaleDateString('fr-FR');
  }
  markDirty();renderCR();renderList();
}
function unarchiveRemarque(crId,lotId,rId){
  const cr=CRS.find(c=>c.id===crId);
  const lot=cr?.lots.find(l=>l.id===lotId);
  const r=lot?.remarques.find(x=>x.id===rId);
  if(r){ r.archived=false; } // stays done=true, shows as strikethrough
  markDirty();renderCR();renderList();
}
function toggleFlag(crId,lotId,rId){
  const cr=CRS.find(c=>c.id===crId);
  const lot=cr?.lots.find(l=>l.id===lotId);
  const r=lot?.remarques.find(x=>x.id===rId);
  if(r)r.flag=!r.flag;
  renderCR();renderList();
}
function deleteRemarque(crId,lotId,rId){
  const cr=CRS.find(c=>c.id===crId);
  const lot=cr?.lots.find(l=>l.id===lotId);
  if(lot)lot.remarques=lot.remarques.filter(r=>r.id!==rId);
  renderCR();renderList();
}
function addRemarque(crId,lotId){
  const inp=document.getElementById('new-r-'+lotId);
  if(!inp||!inp.value.trim())return;
  const cr=CRS.find(c=>c.id===crId);
  const lot=cr?.lots.find(l=>l.id===lotId);
  if(!lot)return;
  const type=(_quickTypes&&_quickTypes[lotId])||'remarque';
  const newR={
    id:'r'+(uid++),
    texte:inp.value.trim(),
    done:false,
    flag:type==='flag',
    decision:type==='decision',
    archived:false,
    createdAt:new Date().toLocaleDateString('fr-FR')
  };
  lot.remarques.push(newR);
  inp.value='';
  markDirty();renderCR();renderList();
  if(type==='action'){
    setTimeout(()=>remarkToAction(crId,lotId,newR.id),50);
  }
}
function editRemarque(crId,lotId,rId){
  const cr=CRS.find(c=>c.id===crId);
  const lot=cr?.lots.find(l=>l.id===lotId);
  const r=lot?.remarques.find(x=>x.id===rId);
  if(!r)return;
  showModal(`<h3>Modifier la remarque</h3>
    <div class="fi"><label>Texte</label><textarea id="er-text" style="min-height:80px">${e(r.texte)}</textarea></div>
    <div style="display:flex;gap:10px;margin-bottom:4px">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="checkbox" id="er-flag" ${r.flag?'checked':''} style="width:15px;height:15px"> À suivre</label>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="checkbox" id="er-done" ${r.done?'checked':''} style="width:15px;height:15px"> Traité / Archivé</label>
    </div>
    <div class="mo-foot">
      <button class="btn" style="color:var(--red);margin-right:auto" onclick="deleteRemarque('${crId}','${lotId}','${rId}');closeModal()" title="Supprimer définitivement">
        <svg class="ico ico-sm"><use href="#i-trash"/></svg> Supprimer
      </button>
      <button class="btn" onclick="closeModal()">Annuler</button>
      <button class="btn btn-p" onclick="saveRemarque('${crId}','${lotId}','${rId}')">${ico('save','ico-sm')} Enregistrer</button>
    </div>`);
}
function saveRemarque(crId,lotId,rId){
  const cr=CRS.find(c=>c.id===crId);
  const lot=cr?.lots.find(l=>l.id===lotId);
  const r=lot?.remarques.find(x=>x.id===rId);
  if(r){
    r.texte=document.getElementById('er-text')?.value||r.texte;
    r.flag=document.getElementById('er-flag')?.checked||false;
    const wasDone=r.done;
    r.done=document.getElementById('er-done')?.checked||false;
    if(r.done&&!wasDone) r.doneAt=new Date().toLocaleDateString('fr-FR');
    if(!r.done){r.doneAt=null;r.archived=false;r.archivedAt=null;}
  }
  closeModal();markDirty();renderCR();renderList();
}

function exportCR(crId){
  const cr=CRS.find(c=>c.id===crId);
  if(!cr)return;

  function pageHeader(){

      </tr>
      <tr>
        <td style="padding:5px 8px;border:1px solid #000;border-top:none;font-size:9pt;width:50%">

        </td>

        </td>
      </tr>
    </table>`;
  }

  // ── Page 1: Intervenants ──
  let page1=`<div class="pr-page" style="padding:20px;font-family:Arial,sans-serif;font-size:9pt;color:#000">
    ${pageHeader()}
    <table style="width:100%;border-collapse:collapse;margin-bottom:4px">
      <tr style="background:#e0e0e0">
        <td colspan="2" style="padding:5px 8px;border:1px solid #000;font-weight:600;font-size:9pt">MAÎTRISE D'OUVRAGE</td>
        <td style="padding:5px 8px;border:1px solid #000;border-left:none;font-weight:600;font-size:9pt">Contact</td>
        <td style="padding:5px 8px;border:1px solid #000;border-left:none;font-weight:600;font-size:9pt;width:60px;text-align:center">Convoqué</td>

    // Use stored color or derive from title — convert to a light print-safe bg

    // Convert hex to RGB and make a light background (15% opacity on white)
    function hexToLightBg(hex){
      const c=hex.replace('#','');
      if(c.length!==6)return '#e0e0e0';
      const r=parseInt(c.substr(0,2),16);
      const g=parseInt(c.substr(2,2),16);
      const b=parseInt(c.substr(4,2),16);
      // mix with white at 15%
      const lr=Math.round(r*0.22+255*0.78);
      const lg=Math.round(g*0.22+255*0.78);
      const lb=Math.round(b*0.22+255*0.78);
      return `rgb(${lr},${lg},${lb})`;

    const bgColor=hexToLightBg(fullColor);

        <td style="padding:5px 8px;border:1px solid #000;border-top:none;font-size:8.5pt;text-align:center">${i+1}</td>

        <td style="padding:5px 8px;border:1px solid #000;border-top:none;border-left:none;font-size:8.5pt">${e(a.echeance)}</td>
        <td style="padding:5px 8px;border:1px solid #000;border-top:none;border-left:none;font-size:8.5pt;text-align:center">${a.done?'✓':'En cours'}</td>
      </tr>`).join('')}
    </table>
    ${cr.dateProchaine?`<div style="margin-top:16px;padding:8px;border:1px solid #000;font-size:9pt;text-align:center">

  // Inject into print area and print

  window.print();

  // Restore after print
  setTimeout(()=>{
    printArea.style.display='none';

function savePrintSnapshot(crId){
  const cr=CRS.find(c=>c.id===crId);
  if(!cr)return;
  const now=new Date();
  const dateStr=now.toLocaleDateString('fr-FR')+' '+now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  // Deep copy the CR state at time of print
  const snapshot={
    id:'snap'+(uid++),
    crId:crId,
    printedAt:dateStr,
    projet:cr.projet,
    date:cr.date,
    numero:cr.numero,
    totalRemarques:cr.lots.flatMap(function(l){return l.remarques;}).length,
    doneRemarques:cr.lots.flatMap(function(l){return l.remarques;}).filter(function(r){return r.archived;}).length,
    totalActions:cr.actions.length,
    doneActions:cr.actions.filter(function(a){return a.done;}).length,
  };
  if(!cr.printHistory) cr.printHistory=[];
  cr.printHistory.unshift(snapshot);
  // Keep max 20 snapshots per CR
  if(cr.printHistory.length>20) cr.printHistory=cr.printHistory.slice(0,20);
  // Show toast after restore
  setTimeout(function(){toast('Export PDF + snapshot enregistré dans l\'historique ✓');},1100);
}

function renameLot(crId,lotId){
  const cr=CRS.find(c=>c.id===crId);
  const lot=cr?.lots.find(l=>l.id===lotId);
  if(!lot)return;
  const name=prompt('Renommer le lot :',lot.titre);
  if(name&&name.trim())lot.titre=name.trim();
  renderCR();
}
function deleteLot(crId,lotId){
  const cr=CRS.find(c=>c.id===crId);
  if(!cr)return;
  const lot=cr.lots.find(l=>l.id===lotId);
  if(!lot)return;
  if(!confirm(`Supprimer le lot "${lot.titre}" et ses ${lot.remarques.length} remarques ?`))return;
  cr.lots=cr.lots.filter(l=>l.id!==lotId);
  renderCR();toast('Lot supprimé');
}

function gsDeleteLot(crId,lotId){
  const cr=CRS.find(c=>c.id===crId);
  if(!cr)return;
  const lot=cr.lots.find(l=>l.id===lotId);
  if(!lot||!confirm('Supprimer le lot "'+lot.titre+'" et ses '+lot.remarques.length+' remarques ?'))return;
  cr.lots=cr.lots.filter(l=>l.id!==lotId);
  openCRSettings(crId);
}
function gsAddLot(crId){
  const cr=CRS.find(c=>c.id===crId);
  if(!cr)return;
  if(!cr.intervenants.length){toast('Ajoutez d\'abord un intervenant','var(--amber)');return;}
  // Use first intervenant by default
  const firstInt=cr.intervenants[0];
  cr.lots.push({id:'l'+(uid++),titre:firstInt.lot,ouvert:true,intId:firstInt.id,remarques:[]});
  openCRSettings(crId);
}
function gsDeleteInt(crId,idx){
  const cr=CRS.find(c=>c.id===crId);
  if(!cr)return;
  const int=cr.intervenants[idx];
  if(!int)return;
  // Check if any lots are linked to this intervenant
  const linked=cr.lots.filter(function(l){return l.intId===int.id;});
  if(linked.length>0){
    if(!confirm('Supprimer "'+( int.entreprise||int.lot)+'" ?\n\nAttention : '+linked.length+' lot(s) lui sont liés ('+linked.map(function(l){return l.titre;}).join(', ')+').\nCes lots seront aussi supprimés.'))return;
    cr.lots=cr.lots.filter(function(l){return l.intId!==int.id;});
  } else {
    if(!confirm('Supprimer "'+(int.entreprise||int.lot)+'" ?'))return;
  }
  cr.intervenants.splice(idx,1);
  openCRSettings(crId);
}
function gsAddInt(crId){

function saveSettings(crId){
  const cr=CRS.find(c=>c.id===crId);
  if(!cr)return;
  // Save lots names + intId links
  cr.lots.forEach(lot=>{
    const el=document.getElementById('gs-lot-'+lot.id);
    if(el&&el.value.trim())lot.titre=el.value.trim();
    const intEl=document.getElementById('gs-lot-int-'+lot.id);
    if(intEl&&intEl.value)lot.intId=intEl.value;
    // lot.color is now derived from intervenant — don't save separately
  });
  // Validate: every lot must have an intId
  const orphans=cr.lots.filter(function(l){return !l.intId||!cr.intervenants.find(function(i){return i.id===l.intId;});});
  if(orphans.length){
    toast(orphans.length+' lot(s) sans intervenant — sélectionnez un intervenant pour chaque lot','var(--amber)');
    return;
  }
  // Save intervenants
  cr.intervenants.forEach((int,ii)=>{
    const lot=document.getElementById('gs-int-lot-'+ii);
    const ent=document.getElementById('gs-int-ent-'+ii);
    const contacts=document.getElementById('gs-int-contacts-'+ii);
    const colorEl=document.getElementById('gs-int-color-'+ii);
    const convoqueEl=document.getElementById('gs-int-convoque-'+ii);
    if(lot)int.lot=lot.value||int.lot;
    if(ent)int.entreprise=ent.value||'';
    if(contacts)int.contacts=contacts.value||'';
    if(colorEl)int.color=colorEl.value;
    if(convoqueEl)int.convoque=convoqueEl.checked;
  });
  // Save actions
  cr.actions.forEach(a=>{
    const texte=document.getElementById('gs-a-texte-'+a.id);
    const intEl=document.getElementById('gs-a-int-'+a.id);
    const ech=document.getElementById('gs-a-ech-'+a.id);
    const done=document.getElementById('gs-a-done-'+a.id);
    if(texte&&texte.value.trim())a.texte=texte.value.trim();
    if(intEl){
      a.intId=intEl.value||null;
      const linked=a.intId?cr.intervenants.find(i=>i.id===a.intId):null;
      a.responsable=linked?(linked.entreprise||linked.lot):a.responsable;
    }
    if(ech)a.echeance=ech.value||'';
    if(done)a.done=done.checked;
  });
  closeModal();
  // Stay on intervenants tab so user sees the color change immediately
  activeTab='intervenants';
  renderCR();
  // Reset tab buttons
  setTimeout(function(){
    document.querySelectorAll('.tab').forEach(function(t,i){
      t.classList.toggle('active',i===1);
    });
  },10);
  renderList();
  toast('Tout enregistré ✓');
}

function moveItem(type, crId, fromIdx, dirOrTo, isAbsolute) {
  const cr = CRS.find(c => c.id === crId);
  if (!cr) return;
  const toIdx = isAbsolute ? dirOrTo : fromIdx + dirOrTo;

  // Save all current field values first
  if (type === 'lot') {
    cr.lots.forEach(function(lot) {
      const el = document.getElementById('gs-lot-' + lot.id);
      if (el && el.value.trim()) lot.titre = el.value.trim();
      const intEl = document.getElementById('gs-lot-int-' + lot.id);
      if (intEl) lot.intId = intEl.value || null;
      const colorEl = document.getElementById('gs-lot-color-' + lot.id);
      if (colorEl) lot.color = colorEl.value;
    });
    if (toIdx < 0 || toIdx >= cr.lots.length) return;
    const moved = cr.lots.splice(fromIdx, 1)[0];
    cr.lots.splice(toIdx, 0, moved);
  } else if (type === 'int') {
    cr.intervenants.forEach(function(int, ii) {
      const lotEl = document.getElementById('gs-int-lot-' + ii);
      const entEl = document.getElementById('gs-int-ent-' + ii);
      const cEl = document.getElementById('gs-int-contacts-' + ii);
      const colEl = document.getElementById('gs-int-color-' + ii);
      if (lotEl) int.lot = lotEl.value || int.lot;
      if (entEl) int.entreprise = entEl.value || '';
      if (cEl) int.contacts = cEl.value || '';
      if (colEl) int.color = colEl.value;
    });
    if (toIdx < 0 || toIdx >= cr.intervenants.length) return;
    const moved = cr.intervenants.splice(fromIdx, 1)[0];
    cr.intervenants.splice(toIdx, 0, moved);
  } else if (type === 'act') {
    cr.actions.forEach(function(a) {
      const tEl = document.getElementById('gs-a-texte-' + a.id);
      const iEl = document.getElementById('gs-a-int-' + a.id);
      const eEl = document.getElementById('gs-a-ech-' + a.id);
      const dEl = document.getElementById('gs-a-done-' + a.id);
      if (tEl && tEl.value.trim()) a.texte = tEl.value.trim();
      if (iEl) { a.intId = iEl.value || null; const lk = a.intId ? cr.intervenants.find(i => i.id === a.intId) : null; a.responsable = lk ? (lk.entreprise || lk.lot) : a.responsable; }
      if (eEl) a.echeance = eEl.value || '';
      if (dEl) a.done = dEl.checked;
    });
    if (toIdx < 0 || toIdx >= cr.actions.length) return;
    const moved = cr.actions.splice(fromIdx, 1)[0];
    cr.actions.splice(toIdx, 0, moved);
  }

  openCRSettings(crId);
  setTimeout(function() {
    const tabIdx = type === 'lot' ? 0 : type === 'int' ? 1 : 2;
    gsCRTab(tabIdx, document.querySelectorAll('.gs-tab')[tabIdx]);
    // Scroll the moved item into view
    const panels = ['gs-p0','gs-p1','gs-p2'];
    const panel = document.getElementById(panels[tabIdx]);
    if (panel) {
      const rows = panel.querySelectorAll('[data-moved]');
      if (rows.length) rows[0].scrollIntoView({block:'nearest'});
    }
  }, 20);
}
