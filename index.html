<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlanSync CR — Compte Rendus Chantier</title>
<meta name="robots" content="noindex,nofollow,nosnippet">
<meta name="description" content="Gestion des comptes rendus de chantier : intervenants, remarques par lot, actions, historique, export PDF.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs" type="module" id="pdfjs-script"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f4f3ef;--bg2:#eceae4;--bg3:#e3e1da;
  --panel:#faf9f7;--border:#dbd9d1;--border2:#ccc9bf;
  --text:#1c1b18;--text2:#4a4840;--text3:#8a877e;
  --blue:#C0B7B6;--blue-bg:#f5f2f2;--blue-lt:#e8e2e1;
  --green:#1a7a4a;--green-bg:#e8f5ee;
  --amber:#c47a00;--amber-bg:#fef3d8;
  --red:#c0392b;--red-bg:#fdecea;
  --purple:#6b3fa0;--purple-bg:#f0ebfa;
  --r:10px;--r2:14px;
  --shadow:0 1px 4px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.05);
  --shadow2:0 4px 20px rgba(0,0,0,.12);
  font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text)
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);height:100vh;overflow:hidden;font-family:inherit}
.app{display:flex;height:100vh}
.sidebar{width:260px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sb-head{padding:14px 14px 10px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.logo-mark{width:34px;height:34px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0;letter-spacing:-.5px}
.sb-list{flex:1;overflow-y:auto;padding:8px}
.cr-item{padding:8px 10px 8px 6px;border-radius:var(--r);cursor:default;border:1px solid transparent;margin-bottom:4px;transition:all .12s;display:flex;align-items:flex-start;gap:4px}
.cr-item:hover{background:var(--bg2)}
.cr-item>div[onclick]{flex:1;min-width:0;cursor:pointer}
.cr-drag-handle{color:var(--border2);cursor:grab;font-size:14px;line-height:1.6;padding:0 2px;flex-shrink:0;user-select:none;transition:color .15s}
.cr-drag-handle:hover{color:var(--text3)}
.cr-drag-handle:active{cursor:grabbing}
.proj-group{margin-bottom:6px}
.proj-header{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:var(--r);cursor:pointer;transition:background .12s}
.proj-header:hover{background:var(--bg2)}
.proj-cr-list{padding-left:10px;border-left:2px solid var(--border);margin:2px 0 2px 12px}
.proj-arch-toggle{width:100%;display:flex;align-items:center;gap:5px;padding:4px 8px 4px 14px;border:none;background:none;cursor:pointer;font-family:inherit;font-size:10px;color:var(--text3);text-align:left;margin-top:2px}
.cr-item.cr-arch{opacity:.6;border-left:3px solid var(--amber)}
.cr-item.active{background:var(--blue-bg);border-color:var(--blue-lt)}
.cr-item-date{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:2px}
.cr-item-proj{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-item-sub{font-size:11px;color:var(--text3);margin-top:2px;display:flex;gap:8px;align-items:center}
.sb-foot{padding:10px 14px;border-top:1px solid var(--border)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--panel);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border:1px solid var(--border2);border-radius:var(--r);background:var(--panel);color:var(--text);font-size:12px;cursor:pointer;font-weight:500;font-family:inherit;transition:all .12s;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn-p{background:var(--blue);color:#3d3533;border-color:var(--blue)}
.btn-p:hover{background:#a89e9d}
.btn-sm{padding:5px 10px;font-size:11.5px}
.btn-g{border:none;background:none;cursor:pointer;font-family:inherit}
.btn-g:hover{background:var(--bg2);border-radius:6px}
.content{flex:1;overflow-y:auto}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px}
.bgreen{background:var(--green-bg);color:var(--green)}
.bamber{background:var(--amber-bg);color:var(--amber)}
.bblue{background:var(--blue-bg);color:var(--blue)}
.bred{background:var(--red-bg);color:var(--red)}
.bgray{background:var(--bg2);color:var(--text3)}
.bpurple{background:var(--purple-bg);color:var(--purple)}
/* CR VIEW */
.cr-header{background:var(--panel);border-bottom:1px solid var(--border);padding:16px 24px}
.cr-meta{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap}
.section{margin-bottom:20px}
.section-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px}
/* Intervenants */
.int-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.int-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px}
.int-lot{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.int-ent{font-size:13px;font-weight:500;margin-bottom:2px}
.int-contact{font-size:11.5px;color:var(--text3)}
/* Remarques */
.lot-block{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.lot-head{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;transition:background .1s}
.lot-head:hover{background:var(--bg2)}
.lot-head-left{display:flex;align-items:center;gap:9px}
.lot-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.lot-title{font-weight:500;font-size:13.5px}
.lot-body{border-top:1px solid var(--border);padding:12px 16px}
.remarque-item{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.remarque-item:last-child{border-bottom:none}
.ri-check{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.ri-check.done{background:var(--blue);border-color:var(--blue);color:#3d3533;}
.ri-check.flagged{background:var(--amber-bg);border-color:var(--amber)}
.ri-text{flex:1;font-size:13px;line-height:1.5}
.ri-text.done-text{text-decoration:line-through;color:var(--text3)}
.ri-actions{display:flex;gap:3px;opacity:0;flex-shrink:0;transition:opacity .12s}
.remarque-item:hover .ri-actions{opacity:1}
/* Actions/décisions */
.action-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:7px;transition:border-color .12s}
.action-row:hover{border-color:var(--border2)}
.action-row.done{opacity:.5}
.ar-status{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:600;cursor:pointer}
/* Tabs */
.tabbar{display:flex;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.tab{padding:15px 20px;font-size:14px;font-weight:500;border:none;background:none;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;font-family:inherit;white-space:nowrap}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
/* New CR form */
.form-section{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:18px;margin-bottom:14px}
.form-section-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.fi{margin-bottom:12px}
.fi label{display:block;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.fi input,.fi select,.fi textarea{width:100%;padding:8px 10px;border:1px solid var(--border2);border-radius:8px;font-size:13px;background:var(--bg);color:var(--text);outline:none;font-family:inherit}
.fi input:focus,.fi select:focus,.fi textarea:focus{border-color:var(--blue);background:var(--panel)}
.fi textarea{resize:vertical;min-height:72px}
/* Modal */
.mo-ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px)}
.mo-box{background:var(--panel);border-radius:var(--r2);padding:24px;width:480px;max-width:95vw;border:1px solid var(--border);box-shadow:var(--shadow2);max-height:90vh;overflow-y:auto}
.mo-box h3{font-size:15px;font-weight:600;margin-bottom:16px}
.mo-foot{display:flex;gap:7px;margin-top:16px;justify-content:flex-end}
/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200;white-space:nowrap}
/* Print */
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:#fff!important;margin:0;padding:0;font-family:Arial,sans-serif;font-size:10pt;color:#000}
  .app{display:block!important;height:auto!important}
  .sidebar,.topbar,.tabbar,.ri-actions,.btn,.sb-foot,.print-hide{display:none!important}
  .main{display:block!important;overflow:visible!important}
  .content{display:none!important}
  #print-area{display:block!important}
  .pr-page{page-break-after:always}
  .pr-page:last-child{page-break-after:avoid}
}
#print-area{display:none}
/* SVG */
.ico{display:inline-block;width:16px;height:16px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico-lg{width:19px;height:19px}
.ico-sm{width:14px;height:14px}
.ico-xs{width:12px;height:12px}
.sortable-ghost{opacity:.3;background:var(--blue-bg)!important;border-color:var(--blue)!important}
@keyframes spin{to{transform:rotate(360deg)}}
.sort-handle{cursor:grab;user-select:none;display:inline-flex;align-items:center}.sort-handle:active{cursor:grabbing}

/* ══ AUTH ══ */
#auth-overlay{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column}
#auth-overlay.hidden{display:none}
.auth-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:36px 40px;width:340px;box-shadow:var(--shadow2);text-align:center}
.auth-box .logo-mark{margin:0 auto 16px;width:44px;height:44px;font-size:16px;border-radius:10px}
.auth-error{color:var(--red);font-size:12px;margin-top:8px;min-height:16px}
</style>
</head>

<div id="auth-overlay">
  <div class="auth-box">
    <div class="logo-mark" id="auth-logo-mark" style="background:var(--blue);display:flex;align-items:center;justify-content:center;color:#3d3533;font-weight:700;font-size:16px">PS</div>
    <div style="font-weight:700;font-size:18px;margin-bottom:4px" id="auth-firm-name">PlanSync</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:24px">Compte Rendus Chantier</div>
    <div class="fi" style="text-align:left">
      <label style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px">Mot de passe</label>
      <input type="password" id="auth-pwd" placeholder="••••••••"
        style="width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:8px;font-size:14px;background:var(--bg);color:var(--text);outline:none;font-family:inherit"
        onkeydown="if(event.key==='Enter')checkAuth()">
    </div>
    <div class="auth-error" id="auth-error"></div>
    <button class="btn btn-p" style="width:100%;justify-content:center;margin-top:12px;padding:10px" onclick="checkAuth()">
      Accéder
    </button>
    <div style="font-size:10px;color:var(--text3);margin-top:16px">Usage interne — accès restreint</div>
  </div>
</div>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sb-head" style="cursor:pointer" onclick="openPdfSettings()" title="Paramètres du cabinet / PDF">
      <div class="logo" id="sb-logo">
        <div class="logo-mark" id="sb-logo-mark" style="width:34px;height:34px;border-radius:8px;font-size:12px;flex-shrink:0">PS</div>
        <div>
          <div style="font-weight:600;font-size:14px;letter-spacing:-.2px" id="sb-firm-name">PlanSync</div>
          <div style="font-size:10px;color:var(--text3)" id="sb-firm-sub">Compte Rendus</div>
        </div>
      </div>
    </div>

    <!-- Search -->
    <div style="padding:8px 10px;border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:6px;background:var(--bg2);border-radius:8px;padding:6px 10px">
        <svg class="ico ico-sm" style="color:var(--text3);flex-shrink:0"><use href="#i-search"/></svg>
        <input id="search-input" placeholder="Rechercher…" style="border:none;background:none;outline:none;font-size:12px;color:var(--text);width:100%;font-family:inherit" oninput="filterCR(this.value)">
      </div>
    </div>

    <div class="sb-list" id="cr-list"></div>

    <div class="sb-foot">
      <div style="display:flex;gap:6px">
        <button class="btn btn-p" style="flex:1;justify-content:center" onclick="openNewCR()">
          <svg class="ico ico-sm"><use href="#i-plus"/></svg> Nouveau CR
        </button>
        <button class="btn" style="padding:7px 10px;flex-shrink:0;font-size:14px;line-height:1" onclick="refreshFromStorage()" title="Actualiser la liste depuis le stockage local">↺</button>
        <button class="btn" style="padding:7px 10px;flex-shrink:0" onclick="openTemplates()" title="Modèles">

// Centralized color resolver: lot→intervenant→derived
function getColor(obj, cr){
  if(!cr) return LOT_COLORS.DEFAULT;
  // If it's a lot — get from its linked intervenant
  if(obj && obj.intId !== undefined){
    const int=cr.intervenants.find(function(i){return i.id===obj.intId;});

    return obj.color||lotColor(obj.titre||'');

  if(obj && obj.id && obj.lot !== undefined){

  }

}

// Tombstone: session list of deleted PV ids — prevents refresh from re-adding them
const _deletedPVIds = new Set();
function _tombstone(crId) {
  _deletedPVIds.add(crId);
  // Also persist to localStorage so next tab/reload still ignores them briefly
  try {
    const saved = JSON.parse(localStorage.getItem('plansync_deleted_ids')||'[]');
    saved.push({id:crId, at:Date.now()});
    // Keep only last 24h
    const fresh = saved.filter(function(x){return Date.now()-x.at < 86400000;});
    localStorage.setItem('plansync_deleted_ids', JSON.stringify(fresh));
  } catch(e){}
}
function _loadTombstones() {
  try {
    const saved = JSON.parse(localStorage.getItem('plansync_deleted_ids')||'[]');
    const fresh = saved.filter(function(x){return Date.now()-x.at < 86400000;});
    fresh.forEach(function(x){_deletedPVIds.add(x.id);});
  } catch(e){}
}

async function _syncToSupabase(){

async function _deleteFromSupabase(crId){

}

async function refreshFromStorage(){
  const sb = getSupabase();
  if(sb){
    // Si un sync est en cours, l'attendre d'abord (max 3s)
    if(_pendingSync){
      await new Promise(function(resolve){setTimeout(resolve, 3000);});
    }
    try {
      const { data, error } = await sb
        .from('crs')
        .select('id, data, updated_at')
        .eq('user_id', SUPA_USER)
        .order('updated_at', { ascending: false });
      if(!error && data && data.length){
        // Remove tombstoned rows before merging
        data = data.filter(function(row){return !_deletedPVIds.has(row.id);});
        // Merge: pour chaque CR, prendre la version la plus récente
        // entre Supabase et localStorage (par updated_at)
        // Skip any IDs that were deleted this session (tombstone)
        const localRaw = localStorage.getItem('plansync_crs');
        const localCRS = localRaw ? JSON.parse(localRaw) : [];
        const localMap = {};
        localCRS.forEach(function(cr){ localMap[cr.id] = cr; });

        const merged = [];
        const seenIds = new Set();

        data.forEach(function(row){
          const remoteUpdated = new Date(row.updated_at).getTime();
          const local = localMap[row.id];
          // Si version locale existe et est plus récente, la garder
          if(local && local._updatedAt && new Date(local._updatedAt).getTime() > remoteUpdated){
            merged.push(local);
          } else {
            merged.push(row.data);
          }
          seenIds.add(row.id);
        });

        // Ajouter les CRs locaux qui ne sont pas encore dans Supabase
        localCRS.forEach(function(cr){
          if(!seenIds.has(cr.id)) merged.push(cr);
        });

        CRS = merged;
        localStorage.setItem('plansync_crs', JSON.stringify(CRS));
        // Pousser les CRs locaux manquants vers Supabase
        _syncToSupabase();
      } else {
        const saved = localStorage.getItem('plansync_crs');
        if(saved) CRS = JSON.parse(saved).filter(function(cr){return !_deletedPVIds.has(cr.id);});
      }
    } catch(e) {
      const saved = localStorage.getItem('plansync_crs');
      if(saved) CRS = JSON.parse(saved).filter(function(cr){return !_deletedPVIds.has(cr.id);});
    }
  } else {
    const saved = localStorage.getItem('plansync_crs');
    if(saved) CRS = JSON.parse(saved);
  }
  // Re-read order + templates + PDF settings
  loadCROrder();
  try {
    const tpl = localStorage.getItem('plansync_cr_templates');
    if(tpl) TEMPLATES = JSON.parse(tpl);
  } catch(e) {}
  try {
    const ps = localStorage.getItem('plansync_pdf_settings');
    if(ps) Object.assign(PDF_SETTINGS, JSON.parse(ps));
  } catch(e) {}
  // Keep activeCR if still exists
  if(activeCR && !CRS.find(function(c){return c.id===activeCR;})){
    activeCR = CRS.length ? CRS[0].id : null;
  } else if(!activeCR && CRS.length){
    activeCR = CRS[0].id;
  }
  updateSidebarLogo();
  renderList();
  if(activeCR) renderCR();
  else {
    const content = document.getElementById('content');
    if(content) content.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text3);font-size:13px">Sélectionnez un CR ou créez-en un nouveau.</div>';
    const tabbar = document.getElementById('tabbar');
    if(tabbar) tabbar.style.display = 'none';
  }
}

function _initSupabaseRealtime(){

}

function loadCROrder(){

function applyCROrder(list){
  // Sort list by CR_ORDER; unknown ids go to end
  if(!CR_ORDER.length) return list;
  const pos={};
  CR_ORDER.forEach(function(id,i){ pos[id]=i; });
  return list.slice().sort(function(a,b){
    const pa=pos[a.id]!==undefined?pos[a.id]:9999;
    const pb=pos[b.id]!==undefined?pos[b.id]:9999;
    return pa-pb;
  });
}

// ⚠️ Protection côté client uniquement — ne remplace pas une vraie protection Vercel/Auth côté serveur.
// Stocker le SHA-256 du mot de passe (jamais le mot de passe en clair).
const AUTH_HASH='963364b3915b6b43f2192109c3b2511b1344b0406dacfbc3685ff8b9d3b18efd';

async function checkAuth(){
  const pwd=document.getElementById('auth-pwd')?.value||'';
  if(!pwd){showAuthError('Entrez le mot de passe');return;}
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pwd));
    const hash=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    if(hash===AUTH_HASH){
      isAuthenticated=true;
      sessionStorage.setItem('ps_auth','1');
      document.getElementById('auth-overlay').classList.add('hidden');
      updateSidebarLogo();
      renderList();
      if(activeCR) renderCR();
      await refreshFromStorage(); // sync depuis Supabase en arrière-plan
      _initSupabaseRealtime();
    } else {
      showAuthError('Mot de passe incorrect');
      document.getElementById('auth-pwd').value='';
      document.getElementById('auth-pwd').focus();
    }
  }catch(e){
    showAuthError('Erreur de vérification — navigateur non compatible');
  }
}
function showAuthError(msg){
  const el=document.getElementById('auth-error');
  if(el)el.textContent=msg;

  const archivedProjs=projOrder.filter(function(pid){return projMap[pid].active.length===0&&projMap[pid].archived.length>0;});

  function renderProjCard(pid){

  // Active projects

}

// Project collapse state (in-memory, resets on reload — intentional)
const _projCollapsed={};
const _projArchOpen={};
let _archSectionOpen=false;
function _toggleArchSection(){
  _archSectionOpen=!_archSectionOpen;
  renderList();
}
function openProject(pid){
  // Open the most recent active CR in this project, or most recent archived if all archived
  const projCRs=CRS.filter(function(cr){return cr.projetId===pid;});
  if(!projCRs.length)return;
  // Prefer active CRs sorted by numero desc, fallback to archived
  const active=projCRs.filter(function(cr){return cr.statut!=='archived';});
  const target=active.length
    ? active.sort(function(a,b){return (b.numero||0)-(a.numero||0);})[0]
    : projCRs.sort(function(a,b){return (b.numero||0)-(a.numero||0);})[0];
  openCR(target.id);
}

function _toggleProj(pid){
  _projCollapsed[pid]=!_projCollapsed[pid];
  renderList();
}
function _toggleProjArch(pid){
  _projArchOpen[pid]=!_projArchOpen[pid];
  renderList();
}

function _toggleProjMenu(pid){
  const menu=document.getElementById('proj-menu-'+pid);
  if(!menu)return;
  const isOpen=menu.style.display!=='none';
  // Close all menus first
  document.querySelectorAll('[id^="proj-menu-"]').forEach(function(m){m.style.display='none';});
  if(!isOpen) menu.style.display='block';
}
// Close project menus when clicking outside
document.addEventListener('click',function(){
  document.querySelectorAll('[id^="proj-menu-"]').forEach(function(m){m.style.display='none';});
});


function archiveProject(pid){
  const projCRs=CRS.filter(function(cr){return cr.projetId===pid;});
  const name=projCRs.length?projCRs[0].projet:'ce projet';
  if(!confirm('Archiver le projet "'+name+'" ?\n\nTous ses CRs seront archivés. Vous pourrez le désarchiver.'))return;
  projCRs.forEach(function(cr){cr.statut='archived';});
  saveCRS();
  if(activeCR&&projCRs.find(function(cr){return cr.id===activeCR;})){
    activeCR=CRS.find(function(cr){return cr.statut!=='archived';})||null;
    activeCR=activeCR?activeCR.id:null;
  }
  renderList();
  if(activeCR)renderCR();
  toast('Projet archivé ✓');
}

function unarchiveProject(pid){
  const projCRs=CRS.filter(function(cr){return cr.projetId===pid;});
  projCRs.forEach(function(cr){cr.statut='published';});
  saveCRS();
  renderList();
  toast('Projet désarchivé ✓');
}

function deleteProject(pid){
  const projCRs=CRS.filter(function(cr){return cr.projetId===pid;});
  const name=projCRs.length?projCRs[0].projet:'ce projet';
  // Safety: block deletion of active (non-fully-archived) projects
  const hasActive=projCRs.some(function(cr){return cr.statut!=='archived';});
  if(hasActive){
    alert('Ce projet contient des PVs actifs. Archivez d\'abord le projet entier avant de le supprimer définitivement.');
    return;
  }
  const total=projCRs.reduce(function(s,cr){return s+cr.lots.reduce(function(s2,l){return s2+l.remarques.length;},0);},0);
  if(!confirm('Supprimer définitivement le projet "'+name+'" ?\n\n'+projCRs.length+' PV(s), '+total+' point(s).\n\nCette action est irréversible.'))return;
  // Tombstone all PV ids before removing
  projCRs.forEach(function(cr){_tombstone(cr.id);});
  CRS=CRS.filter(function(cr){return cr.projetId!==pid;});
  saveCRS();
  // Delete from Supabase (async, best-effort)
  (async function(){
    const sb=getSupabase();
    if(!sb)return;
    for(const cr of projCRs){
      try{await sb.from('crs').delete().eq('id',cr.id).eq('user_id',SUPA_USER);}catch(e){}
    }
  })();
  if(activeCR&&projCRs.find(function(cr){return cr.id===activeCR;})){
    activeCR=CRS.length?CRS[0].id:null;
  }
  renderList();
  if(activeCR)renderCR();
  else{
    const ct=document.getElementById('content');
    if(ct)ct.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text3);font-size:13px">Sélectionnez un projet.</div>';
    const tb=document.getElementById('tabbar');
    if(tb)tb.style.display='none';
  }
  toast('Projet supprimé définitivement');
}

function filterCR(q){searchQuery=q.toLowerCase();renderList();}

/* ══ OPEN CR ══ */
function openCR(id){
  activeCR=id;
  activeTab='remarques';
  remarqueSearch='';
  quickFilter='all';
  actionFilter='';
  actionStatusFilter='all';
  lotsSortedByFlags=false;
  if(window._datesState&&window._datesState.crId!==id) window._datesState=null;
  // Ensure the project containing this CR is expanded
  const cr=CRS.find(function(c){return c.id===id;});
  if(cr&&cr.projetId) _projCollapsed[cr.projetId]=false;
  renderList();
  renderCR();
}

function renderCR(){
  const cr=CRS.find(c=>c.id===activeCR);
  if(!cr)return;

  document.getElementById('tb-title').textContent=cr.projet;
  document.getElementById('tb-sub').textContent=`CR n°${cr.numero} — ${cr.date} — Prochaine réunion: ${cr.dateProchaine}`;
  document.getElementById('tb-icon').innerHTML=`<use href="#i-file"/>`;
  document.getElementById('tabbar').style.display='flex';

  // Archived banner inside content if needed
  const existingBanner=document.getElementById('arch-banner');
  if(cr.statut==='archived'){
    // Always refresh banner so buttons reference the current CR id
    if(existingBanner) existingBanner.remove();
    const banner=document.createElement('div');
    banner.id='arch-banner';
    banner.style.cssText='background:var(--amber-bg);border-bottom:1px solid var(--amber);padding:8px 20px;font-size:12px;color:var(--amber);display:flex;align-items:center;gap:8px;flex-shrink:0';
    banner.innerHTML=`<svg class="ico ico-sm"><use href="#i-archive"/></svg> Ce compte rendu est archivé — il est en lecture seule dans l'historique.
      <div style="display:flex;gap:10px;align-items:center;margin-left:auto">
        <button onclick="toggleArchiveCR('${cr.id}')" style="background:none;border:none;cursor:pointer;color:var(--blue);font-size:12px;font-family:inherit;text-decoration:underline">Désarchiver</button>
        <button onclick="deleteSinglePV('${cr.id}')" style="background:none;border:1px solid var(--red);color:var(--red);border-radius:var(--r);padding:3px 10px;font-size:11px;cursor:pointer;font-family:inherit">Supprimer définitivement</button>
      </div>`;
    const tabbar=document.getElementById('tabbar');
    tabbar.parentNode.insertBefore(banner,tabbar);

  // Reset tab UI
  document.querySelectorAll('.tab').forEach((t,i)=>{
    const tabs=['remarques','actions','intervenants','dates','pv'];
    t.classList.toggle('active',tabs[i]===activeTab);

    <button class="btn btn-sm" onclick="previewPDF('${cr.id}')" title="Aperçu PDF avant impression"><svg class="ico ico-sm"><use href="#i-printer"/></svg> Aperçu PDF</button>

    <button class="btn btn-sm ${isArchived?'':'btn-amber'}" onclick="toggleArchiveCR('${cr.id}')" title="${isArchived?'Désarchiver':'Archiver ce CR'}" style="${isArchived?'':'color:var(--amber);border-color:var(--amber)'}">
      <svg class="ico ico-sm"><use href="#i-archive"/></svg> ${isArchived?'Désarchiver':'Archiver'}
    </button>
    <button class="btn btn-p btn-sm" onclick="cloneCR('${cr.id}')" style="background:var(--green);border-color:var(--green);color:#fff;font-weight:600">${ico('plus','ico-sm')} CR Suivant</button>`;

  if(activeTab==='remarques') renderRemarques(cr);
  else if(activeTab==='intervenants') renderIntervenants(cr);
  else if(activeTab==='actions') renderActions(cr);
  else if(activeTab==='dates') renderDates(cr);
  else if(activeTab==='pv') renderHistorique(cr);
}

                  ${!r.done?`<button onclick="toggleDone('${cr.id}','${lot.id}','${r.id}');closeAllMenus()" style="width:100%;text-align:left;padding:7px 14px;border:none;background:none;cursor:pointer;font-size:12px;font-family:inherit;color:var(--green)">

          }).join('');
          out+='</div>';

          if(archived.length){
            out+=`<div style="margin-top:8px;border-top:1px dashed var(--border2)">
              <button onclick="var el=document.getElementById('${archId}');el.style.display=el.style.display==='none'?'block':'none'" style="display:flex;align-items:center;gap:6px;padding:6px 0;border:none;background:none;cursor:pointer;font-family:inherit;font-size:11px;font-weight:600;color:var(--text3);width:100%">

                  <button class="btn-g" style="padding:3px" onclick="deleteRemarque('${cr.id}','${lot.id}','${r.id}')" title="Supprimer définitivement"><svg class="ico ico-xs" style="color:var(--red)"><use href="#i-trash"/></svg></button>
                </div>`).join('')}

            </div>`;

          return out;
        })()}

              <input type="checkbox" id="new-r-flag-${lot.id}" style="width:13px;height:13px;accent-color:var(--amber)"> À suivre
            </label>
            <button class="btn btn-p btn-sm" onclick="addRemarque('${cr.id}','${lot.id}')">${ico('plus','ico-xs')}</button>
          </div>
        </div>
      </div>`:``}
    </div>`;
  });
  html+='</div>';
  document.getElementById('content').innerHTML=html;
  // Init SortableJS drag on each lot's remarques list
  if(typeof Sortable !== 'undefined'){
    cr.lots.forEach(function(lot){
      var el=document.getElementById('lot-rmks-'+lot.id);
      if(!el)return;
      Sortable.create(el,{
        animation:120,
        handle:'.r-drag-handle',
        filter:'input,textarea,select,button,label',
        preventOnFilter:true,
        ghostClass:'sortable-ghost',
        onEnd:function(evt){
          if(evt.oldIndex===evt.newIndex)return;
          var crId=el.dataset.crid;
          var lotId=el.dataset.lotid;
          // Move in data using absolute indices
          var cr2=CRS.find(function(c){return c.id===crId;});
          var lot2=cr2&&cr2.lots.find(function(l){return l.id===lotId;});
          if(!lot2)return;
          // Indices are within active (non-archived) subset — need to map to full array
          var activeIds=lot2.remarques.filter(function(r){return !r.archived;}).map(function(r){return r.id;});
          var movedId=activeIds[evt.oldIndex];
          var targetId=activeIds[evt.newIndex];
          if(!movedId||!targetId||movedId===targetId)return;
          var fromIdx=lot2.remarques.findIndex(function(r){return r.id===movedId;});
          var toIdx=lot2.remarques.findIndex(function(r){return r.id===targetId;});
          if(fromIdx<0||toIdx<0)return;
          var moved=lot2.remarques.splice(fromIdx,1)[0];
          lot2.remarques.splice(toIdx,0,moved);
          markDirty();
          // No re-render needed — SortableJS already moved the DOM node
        }
      });
    });
  }
}

/* ══ ACTIONS ══ */
function renderActions(cr){
  // Status filter first
  const allActions=cr.actions;
  const lateActions=allActions.filter(a=>!a.done&&isLate(a.echeance));
  const soonActions=allActions.filter(a=>!a.done&&isSoon(a.echeance));

  // Status filter
  let filteredActions=allActions;
  if(actionStatusFilter==='late') filteredActions=allActions.filter(a=>!a.done&&isLate(a.echeance));
  else if(actionStatusFilter==='soon') filteredActions=allActions.filter(a=>!a.done&&isSoon(a.echeance));
  else if(actionStatusFilter==='open') filteredActions=allActions.filter(a=>!a.done);
  else if(actionStatusFilter==='done') filteredActions=allActions.filter(a=>a.done);

  // Then by-intervenant filter on top
  if(actionFilter) filteredActions=filteredActions.filter(a=>a.intId===actionFilter);

  const todo=filteredActions.filter(a=>!a.done);
  const done=filteredActions.filter(a=>a.done);
  const allTodo=allActions.filter(a=>!a.done);
  const allDone=allActions.filter(a=>a.done);

  // Status quick filters
  const statusFilters=[
    ['all','Toutes',allActions.length,'var(--text2)'],
    ['late','En retard',lateActions.length,'var(--red)'],
    ['soon','Avant prochaine réunion',soonActions.length,'var(--amber)'],
    ['open','En cours',allTodo.length,'var(--text2)'],
    ['done','Terminées',allDone.length,'var(--green)'],
  ].map(([k,label,count,col])=>`
    <button onclick="actionStatusFilter='${k}';renderActions(CRS.find(c=>c.id==='${cr.id}'))"
      style="padding:4px 11px;border-radius:16px;border:1.5px solid ${actionStatusFilter===k?col:'var(--border)'};background:${actionStatusFilter===k?col+'18':'transparent'};color:${actionStatusFilter===k?col:'var(--text3)'};font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">
      ${label} <span style="opacity:.7">${count}</span>
    </button>`).join('');

  // Intervenant chips (secondary filter)
  const intervenantIds=[...new Set(cr.actions.map(a=>a.intId).filter(Boolean))];
  const filterChips=intervenantIds.map(intId=>{
    const iv=cr.intervenants.find(i=>i.id===intId);
    if(!iv)return '';
    const col=getColor(iv,cr);
    const active=actionFilter===intId;
    return `<button onclick="actionFilter='${active?'':intId}';renderActions(CRS.find(c=>c.id==='${cr.id}'))"
      style="font-size:10px;padding:2px 9px;border-radius:10px;border:1.5px solid ${col};background:${active?col:'transparent'};color:${active?'#fff':col};cursor:pointer;font-family:inherit;font-weight:600">
      ${iv.entreprise||iv.lot}
    </button>`;
  }).join('');

  function actionCard(a,isDone){
    const linked=a.intId?cr.intervenants.find(i=>i.id===a.intId):null;
    const linkedLabel=linked?(linked.entreprise||linked.lot):a.responsable;
    const linkedColor=linked?getColor(linked,cr):'var(--text3)';
    const late=!isDone&&isLate(a.echeance);
    const soon=!isDone&&!late&&isSoon(a.echeance);
    const statusBg=isDone?'var(--green-bg)':late?'var(--red-bg)':soon?'var(--amber-bg)':'var(--bg2)';
    const statusColor=isDone?'var(--green)':late?'var(--red)':soon?'var(--amber)':'var(--text3)';
    const imgGrid=(a.images&&a.images.length)?`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px">${a.images.map(img=>`
      <div style="position:relative;border-radius:5px;overflow:hidden;border:1px solid var(--border)">
        <img src="${img.data}" style="width:80px;height:60px;object-fit:cover;display:block" title="${e(img.caption||img.name)}">
        ${img.caption?`<div style="padding:2px 4px;font-size:9px;color:var(--text3);background:var(--bg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px">${e(img.caption)}</div>`:''}
        <button onclick="deleteActionImage('${cr.id}','${a.id}','${img.id}')" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);border:none;color:#fff;border-radius:50%;width:16px;height:16px;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">x</button>
      </div>`).join('')}</div>`:'';
    return `<div class="action-row ${isDone?'done':''}" style="${late?'border-left:3px solid var(--red)':soon?'border-left:3px solid var(--amber)':''}">
      <div class="ar-status" style="background:${statusBg};color:${statusColor};cursor:pointer" onclick="toggleAction('${cr.id}','${a.id}')">
        ${isDone?ico('check','ico-xs'):late?'!':soon?'~':ico('alert','ico-xs')}
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;${isDone?'text-decoration:line-through;color:var(--text3)':''}">${a.texte}</div>
        <div style="font-size:11px;margin-top:3px;display:flex;gap:7px;align-items:center;flex-wrap:wrap">
          ${linkedLabel?`<span style="font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;background:${linkedColor}18;color:${linkedColor}">${linkedLabel}</span>`:''}
          ${a.echeance?`<span style="color:${late?'var(--red)':soon?'var(--amber)':'var(--text3)'};font-weight:${late||soon?'600':'400'}">${ico('calendar','ico-xs')} ${a.echeance}${late?' EN RETARD':soon?' Bientot':''}</span>`:''}
        </div>
        ${imgGrid}
      </div>
      <div style="display:flex;gap:3px;flex-shrink:0">
        <button class="btn-g" style="padding:3px" onclick="openAddActionImage('${cr.id}','${a.id}')" title="Ajouter une image"><svg class="ico ico-xs"><use href="#i-upload"/></svg></button>
        <button class="btn-g" style="padding:3px" onclick="editAction('${cr.id}','${a.id}')" title="Modifier">${ico('edit','ico-xs')}</button>
        <button class="btn-g" style="padding:3px" onclick="deleteAction('${cr.id}','${a.id}')" title="Supprimer"><svg class="ico ico-xs" style="color:var(--red)"><use href="#i-trash"/></svg></button>
      </div>
    </div>`;
  }

  document.getElementById('content').innerHTML=`<div style="padding:12px 20px">
    <!-- Header -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="display:flex;gap:8px;align-items:center">
        <span style="font-size:13px;font-weight:600">${allActions.length} actions</span>
        ${lateActions.length?`<span class="badge bred">${lateActions.length} en retard</span>`:''}
        ${soonActions.length?`<span class="badge bamber">${soonActions.length} bientôt</span>`:''}
      </div>
      <button class="btn btn-p btn-sm" onclick="openAddAction('${cr.id}')">${ico('plus','ico-sm')} Ajouter</button>
    </div>

    <!-- Status quick filters -->
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">
      ${statusFilters}
    </div>

    <!-- Intervenant chips -->
    ${filterChips?`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)">${filterChips}</div>`:''}

    ${todo.length?`<div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">En cours (${todo.length})</div>`:''}
    ${todo.map(a=>actionCard(a,false)).join('')}

    ${done.length?`<div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px">Terminées (${done.length})</div>`:''}
    ${done.map(a=>actionCard(a,true)).join('')}

    ${!allActions.length?`<div style="text-align:center;padding:40px;color:var(--text3)">
      <svg class="ico" style="width:36px;height:36px;display:block;margin:0 auto 10px"><use href="#i-check"/></svg>
      Aucune action pour ce CR
    </div>`:''}
    ${allActions.length&&todo.length===0&&done.length===0&&(actionFilter||actionStatusFilter!=='all')?`<div style="text-align:center;padding:30px;color:var(--text3);font-size:13px">Aucune action pour ce filtre</div>`:''}
  </div>`;
}

/* ══ DATES ══ */
function renderDates(cr){
  // Persistent filter/search state — survives re-renders within the same CR
  if(!window._datesState) window._datesState={};
  const ds=window._datesState;
  if(ds.crId!==cr.id){ds.crId=cr.id;ds.filter='all';ds.q='';ds.lot='';}

  // Build action lookup: remark id → action(s) mentioning it
  const actionsByRemark={};
  (cr.actions||[]).forEach(function(a){
    if(a.linkedRId){
      if(!actionsByRemark[a.linkedRId]) actionsByRemark[a.linkedRId]=[];
      actionsByRemark[a.linkedRId].push(a);
    }
  });

  // Collect all rows
  const allRows=[];
  cr.lots.forEach(function(lot){
    const color=getColor(lot,cr);
    const linked=lot.intId?cr.intervenants.find(function(i){return i.id===lot.intId;}):null;
    lot.remarques.forEach(function(r){
      allRows.push({r:r,lot:lot,color:color,linked:linked,actions:actionsByRemark[r.id]||[]});
    });
  });

  if(!allRows.length){
    document.getElementById('content').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text3);font-size:13px">Aucun point dans ce CR</div>';
    return;
  }

  // Build lot chips (only lots with ≥1 remark)
  const lotIds=[];const lotMap={};
  cr.lots.forEach(function(lot){
    if(lot.remarques.length){lotIds.push(lot.id);lotMap[lot.id]=lot;}
  });

  // Filter by status + lot + search
  const q=(ds.q||'').toLowerCase().trim();
  function matchesSearch(x){
    if(!q)return true;
    const lbl=(x.linked?x.linked.entreprise||x.linked.lot:x.lot.titre)||'';
    const lot=x.lot.titre||'';
    const contacts=(x.linked?x.linked.contacts||'':'');
    const actText=x.actions.map(function(a){return (a.texte||'')+' '+(a.responsable||'');}).join(' ');
    return (x.r.texte||'').toLowerCase().includes(q)
      ||lbl.toLowerCase().includes(q)
      ||lot.toLowerCase().includes(q)
      ||(x.linked?x.linked.entreprise||'':'').toLowerCase().includes(q)
      ||contacts.toLowerCase().includes(q)
      ||actText.toLowerCase().includes(q);
  }
  let rows=allRows.filter(matchesSearch);
  if(ds.filter==='encours')   rows=rows.filter(function(x){return !x.r.done&&!x.r.archived;});
  else if(ds.filter==='asuivre') rows=rows.filter(function(x){return x.r.flag&&!x.r.done&&!x.r.archived;});
  else if(ds.filter==='classe')  rows=rows.filter(function(x){return x.r.done||x.r.archived;});
  if(ds.lot) rows=rows.filter(function(x){return x.lot.id===ds.lot;});

  // Stats on all rows (pre-filter)
  const totalAll=allRows.length;
  const enCours=allRows.filter(function(x){return !x.r.done&&!x.r.archived;}).length;
  const asuivre=allRows.filter(function(x){return x.r.flag&&!x.r.done&&!x.r.archived;}).length;
  const classe=allRows.filter(function(x){return x.r.done||x.r.archived;}).length;

  // Sort: active first (newest first), then classés (most recently treated first)
  function parseFR(s){const p=(s||'').split('/');return p.length===3?new Date(p[2],p[1]-1,p[0]).getTime():0;}
  rows.sort(function(a,b){
    const aDone=a.r.done||a.r.archived;const bDone=b.r.done||b.r.archived;
    if(aDone&&!bDone)return 1;if(!aDone&&bDone)return -1;
    if(aDone){return parseFR(b.r.archivedAt||b.r.doneAt)-parseFR(a.r.archivedAt||a.r.doneAt);}
    return parseFR(b.r.createdAt)-parseFR(a.r.createdAt);
  });

  function tableRow(x){
    const r=x.r;const lot=x.lot;const color=x.color;const linked=x.linked;
    const isDone=r.done||r.archived;
    const lbl=linked?linked.entreprise||linked.lot:lot.titre;
    const linkedActs=x.actions;
    return '<tr style="'+(isDone?'opacity:.6;background:var(--green-bg)':'')+'">'
      +'<td style="padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top;white-space:nowrap">'
        +'<span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;background:'+color+'18;color:'+color+'">'+e(lbl)+'</span>'
      +'</td>'
      +'<td style="padding:7px 10px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:top">'
        +(isDone?'<span style="text-decoration:line-through;color:var(--text3)">'+e(r.texte)+'</span>':e(r.texte))
        +(r.flag&&!isDone?'<span style="margin-left:6px;font-size:10px;font-weight:600;padding:2px 5px;background:var(--amber-bg);color:var(--amber);border-radius:3px">À suivre</span>':'')
        +(linkedActs.length?'<div style="margin-top:3px">'
          +linkedActs.map(function(a){
            return '<span style="font-size:10px;color:var(--text3);background:var(--bg2);border-radius:3px;padding:1px 5px">'
              +'Action'+(a.responsable?' — '+e(a.responsable):'')+''
              +(a.done?' ✓':'')+'</span>';
          }).join(' ')+'</div>':'')
      +'</td>'
      +'<td style="padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:top;font-size:11px;color:var(--text3)">'
        +'<div>'+(r.createdAt||'—')+'</div>'
        +(isDone&&(r.archivedAt||r.doneAt)?'<div style="color:var(--green);margin-top:2px">Classé le '+(r.archivedAt||r.doneAt)+'</div>':'')
      +'</td>'
      +'<td style="padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:top;text-align:center">'
        +(isDone
          ?'<button class="btn-g" style="padding:2px" onclick="toggleDone(\''+cr.id+'\',\''+lot.id+'\',\''+r.id+'\')" title="Remettre en cours"><svg class="ico ico-xs" style="color:var(--green)"><use href="#i-check"/></svg></button>'
          :'<button class="btn-g" style="padding:2px" onclick="toggleDone(\''+cr.id+'\',\''+lot.id+'\',\''+r.id+'\')" title="Classer (marquer traité)"><svg class="ico ico-xs" style="color:var(--text3)"><use href="#i-check"/></svg></button>'
        )
        +'<button class="btn-g" style="padding:2px" onclick="editRemarque(\''+cr.id+'\',\''+lot.id+'\',\''+r.id+'\')" title="Modifier"><svg class="ico ico-xs"><use href="#i-edit"/></svg></button>'
      +'</td>'
    +'</tr>';
  }

  function filterBtn(key,label,count,col){
    const active=ds.filter===key;
    const c2=col||(active?'var(--blue)':'var(--text3)');
    return '<button onclick="window._datesState.filter=\''+key+'\';renderCR()" style="'
      +'padding:5px 11px;border-radius:20px;border:1.5px solid '+(active?c2:'var(--border2)')
      +';background:'+(active?c2+'1a':'none')
      +';color:'+(active?c2:'var(--text3)')
      +';font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap">'
      +label+(count!==undefined?' <span style="opacity:.7;font-size:10px">('+count+')</span>':'')+'</button>';
  }

  // Lot chip buttons (only if >1 lot)
  const lotChips=lotIds.length>1
    ?'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">'
      +'<button onclick="window._datesState.lot=\'\';renderCR()" style="padding:3px 9px;border-radius:20px;border:1.5px solid '+(ds.lot?'var(--border2)':'var(--blue)')+';background:'+(ds.lot?'none':'var(--blue-bg)')+';color:'+(ds.lot?'var(--text3)':'var(--blue)')+';font-size:10px;cursor:pointer;font-family:inherit">Tous les lots</button>'
      +lotIds.map(function(lid){
        const lot=lotMap[lid];
        const col=getColor(lot,cr);
        const active=ds.lot===lid;
        return '<button onclick="window._datesState.lot=\''+lid+'\';renderCR()" style="'
          +'padding:3px 9px;border-radius:20px;border:1.5px solid '+(active?col:'var(--border2)')
          +';background:'+(active?col+'22':'none')
          +';color:'+(active?col:'var(--text3)')
          +';font-size:10px;cursor:pointer;font-family:inherit">'+e(lot.titre)+'</button>';
      }).join('')
    +'</div>':'' ;

  const noResults=rows.length===0;

  document.getElementById('content').innerHTML=''
    +'<div style="padding:14px 20px">'

    // Status filter bar + search
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px">'
      +filterBtn('all','Tous',totalAll)
      +filterBtn('encours','En cours',enCours,'var(--text2)')
      +filterBtn('asuivre','À suivre',asuivre,'var(--amber)')
      +filterBtn('classe','Classés',classe,'var(--green)')
      +'<div style="display:flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:4px 10px;margin-left:auto">'
        +'<svg class="ico" style="width:12px;height:12px;color:var(--text3);flex-shrink:0"><use href="#i-search"/></svg>'
        +'<input id="dates-search" value="'+e(ds.q||'')+'" placeholder="Texte, lot, entreprise, action…" oninput="window._datesState.q=this.value;renderCR()" style="border:none;background:none;outline:none;font-size:11px;color:var(--text);width:190px;font-family:inherit">'
        +(ds.q?'<button onclick="window._datesState.q=\'\';renderCR()" style="background:none;border:none;cursor:pointer;color:var(--text3);padding:0;font-size:13px;line-height:1">×</button>':'')
      +'</div>'
    +'</div>'

    // Lot chips
    +lotChips

    // Stats row
    +'<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">'
      +'<div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:5px 10px;display:flex;gap:5px;align-items:center">'
        +'<span style="font-size:15px;font-weight:600;color:var(--text)">'+totalAll+'</span>'
        +'<span style="font-size:11px;color:var(--text3)">points</span>'
      +'</div>'
      +(asuivre?'<div style="background:var(--amber-bg);border:1px solid var(--amber);border-radius:var(--r);padding:5px 10px;display:flex;gap:5px;align-items:center">'
        +'<span style="font-size:15px;font-weight:600;color:var(--amber)">'+asuivre+'</span>'
        +'<span style="font-size:11px;color:var(--amber)">à suivre</span>'
      +'</div>':'')
      +(classe?'<div style="background:var(--green-bg);border:1px solid var(--green);border-radius:var(--r);padding:5px 10px;display:flex;gap:5px;align-items:center">'
        +'<span style="font-size:15px;font-weight:600;color:var(--green)">'+classe+'</span>'
        +'<span style="font-size:11px;color:var(--green)">classés</span>'
      +'</div>':'')
      +'<div style="font-size:11px;color:var(--text3);margin-left:auto;align-self:center">CR du '+(cr.date||'—')+'</div>'
    +'</div>'

    // Table
    +(noResults
      ?'<div style="text-align:center;padding:30px;color:var(--text3);font-size:13px">Aucun point correspondant</div>'
      :'<div style="background:var(--panel);border:1px solid var(--border);border-radius:var(--r);overflow:hidden">'
        +'<table style="width:100%;border-collapse:collapse">'
          +'<thead><tr style="background:var(--bg2)">'
            +'<th style="padding:7px 10px;text-align:left;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap">Lot / Intervenant</th>'
            +'<th style="padding:7px 10px;text-align:left;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)">Point</th>'
            +'<th style="padding:7px 10px;text-align:left;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap">Dates</th>'
            +'<th style="padding:7px 10px;text-align:center;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap">Options</th>'
          +'</tr></thead>'
          +'<tbody>'+rows.map(tableRow).join('')+'</tbody>'
        +'</table>'
      +'</div>'
    )

    +'</div>';

  // Restore search focus without moving cursor
  const si=document.getElementById('dates-search');
  if(si&&document.activeElement!==si&&ds.q){si.focus();const v=si.value;si.setSelectionRange(v.length,v.length);}

/* ══ HISTORIQUE ══ */
function renderHistorique(currentCR){
  // Find all CRs for the same project by projetId (stable), fallback to name
  const pid=currentCR.projetId;
  const siblings=CRS
    .filter(c=>pid ? c.projetId===pid : c.projet===currentCR.projet)
    .sort((a,b)=>b.numero-a.numero); // newest first

  if(siblings.length<=1){
    document.getElementById('content').innerHTML=`
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--text3)">
        <svg class="ico" style="width:38px;height:38px"><use href="#i-calendar"/></svg>
        <div style="font-weight:500">Aucun autre PV</div>
        <div style="font-size:12px">Créez un nouveau PV pour voir l'historique</div>
      </div>`;
    return;
  }

  // Stats per CR
  function crStats(cr){
    const all=cr.lots.flatMap(l=>l.remarques);
    const done=all.filter(r=>r.archived).length;
    const flags=all.filter(r=>r.flag&&!r.archived).length;
    const actTodo=cr.actions.filter(a=>!a.done).length;
    const actDone=cr.actions.filter(a=>a.done).length;
    return {total:all.length,done,flags,actTodo,actDone};
  }

  const html=`<div style="padding:20px 28px;max-width:800px">
    <div style="font-size:13px;font-weight:500;margin-bottom:18px;color:var(--text2)">
      ${siblings.length} compte${siblings.length>1?'s':''} rendu${siblings.length>1?'s':''} — ${currentCR.projet}
    </div>

    <!-- Timeline -->
    <div style="position:relative">
      <!-- vertical line -->
      <div style="position:absolute;left:20px;top:0;bottom:0;width:2px;background:var(--border);border-radius:1px"></div>

      ${siblings.map((cr,idx)=>{
        const s=crStats(cr);
        const isCurrent=cr.id===currentCR.id;
        const isArchived=cr.statut==='archived';
        return `<div style="display:flex;gap:16px;margin-bottom:18px;position:relative">
          <!-- Timeline dot -->
          <div style="width:40px;flex-shrink:0;display:flex;justify-content:center;padding-top:10px;position:relative;z-index:1">
            <div style="width:14px;height:14px;border-radius:50%;border:2.5px solid ${isCurrent?'var(--blue)':isArchived?'var(--amber)':'var(--border2)'};background:${isCurrent?'var(--blue)':isArchived?'var(--amber-bg)':'var(--panel)'}"></div>
          </div>

          <!-- Card -->
          <div onclick="jumpToCR('${cr.id}')" style="flex:1;background:${isCurrent?'var(--blue-bg)':'var(--panel)'};border:${isCurrent?'1.5px solid var(--blue-lt)':isArchived?'1px solid var(--amber)':'1px solid var(--border)'};border-radius:var(--r2);padding:14px 16px;cursor:pointer;transition:all .15s" onmouseover="this.style.borderColor='var(--blue-lt)'" onmouseout="this.style.borderColor='${isCurrent?'var(--blue-lt)':'var(--border)'}'">

            <!-- Header -->
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px">
              <div>
                <div style="display:flex;align-items:center;gap:7px;margin-bottom:2px">
                  <span style="font-weight:600;font-size:13.5px;color:${isCurrent?'var(--blue)':'var(--text)'}">CR n°${cr.numero}</span>
                  ${isCurrent?`<span class="badge bblue" style="font-size:9px">En cours</span>`:''}
                  ${isArchived?`<span class="badge bamber" style="font-size:9px">Archivé</span>`:''}
                </div>
                <div style="font-size:12px;font-weight:500;color:var(--text2)">${cr.date}</div>
                ${cr.dateProchaine?`<div style="font-size:11px;color:var(--text3);margin-top:1px">Prochaine réunion : ${cr.dateProchaine}</div>`:''}
                ${cr.redacteur?`<div style="font-size:11px;color:var(--text3)">Rédacteur : ${cr.redacteur}</div>`:''}
              </div>

            </div>

            <!-- Stats row -->
            <div style="display:flex;gap:10px;flex-wrap:wrap">
              <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)">
                <svg class="ico ico-xs"><use href="#i-file"/></svg>
                <span>${s.total} point${s.total!==1?"s":""}</span>
              </div>
              ${s.done?`<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green)">
                <svg class="ico ico-xs"><use href="#i-check"/></svg>
                <span>${s.done} classé${s.done!==1?"s":""}</span>
              </div>`:''}
              <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)">
              </div>
              ${s.flags?`<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--amber)">
                <svg class="ico ico-xs"><use href="#i-flag"/></svg>
                <span>${s.flags} à suivre</span>
              </div>`:''}
              <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)">
                <svg class="ico ico-xs"><use href="#i-check"/></svg>
<span>${s.actTodo} action${s.actTodo!==1?"s":""} ouverte${s.actTodo!==1?"s":""}</span>
              </div>
              ${s.actDone?`<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green)">
                <svg class="ico ico-xs"><use href="#i-check"/></svg>
                <span>${s.actDone} action${s.actDone!==1?"s":""} terminée${s.actDone!==1?"s":""}</span>
              </div>`:''}
              <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)">
              </div>
              <div style="margin-left:auto">
                <span style="font-size:11px;color:${isCurrent?'var(--blue)':'var(--text3)'};font-weight:500">${isCurrent?'Vue actuelle →':'Ouvrir →'}</span>
              </div>
            </div>

            <!-- Lots summary (only show if not too many) -->
            ${s.flags>0?`<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:5px">
              ${cr.lots.filter(l=>l.remarques.some(r=>r.flag&&!r.archived)).map(l=>`
                <span style="font-size:10px;padding:2px 7px;border-radius:10px;background:${getColor(l,cr)}18;color:${getColor(l,cr)}">${l.titre}</span>
              `).join('')}
            </div>`:''}
          </div>
          ${isArchived?`<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;justify-content:flex-end">
            <button onclick="event.stopPropagation();deleteSinglePV('${cr.id}')" style="background:none;border:1px solid var(--red);color:var(--red);border-radius:var(--r);padding:4px 12px;font-size:11px;cursor:pointer;font-family:inherit">
              Supprimer définitivement
            </button>
          </div>`:''}
        </div>`;
      }).join('')}
    </div>

    <!-- New CR button -->
    <div style="display:flex;justify-content:center;margin-top:8px;padding-left:56px">
    </div>

    <!-- Print History -->
    ${currentCR.printHistory&&currentCR.printHistory.length?`
    <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border)">
      <div style="font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;display:flex;align-items:center;gap:7px">
        <svg class="ico ico-sm"><use href="#i-printer"/></svg> Historique des exports PDF (${currentCR.printHistory.length})
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${currentCR.printHistory.map((snap,si)=>`
          <div style="display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px">
            <svg class="ico ico-sm" style="color:var(--text3);flex-shrink:0"><use href="#i-printer"/></svg>
            <div style="flex:1;min-width:0">
              <div style="font-size:12.5px;font-weight:500">Export du ${snap.printedAt}</div>
              <div style="font-size:11px;color:var(--text3);margin-top:2px;display:flex;gap:10px">
                <span>${snap.totalRemarques} points (${snap.doneRemarques} archivés)</span>
                <span>·</span>
                <span>${snap.totalActions-snap.doneActions} action${(snap.totalActions-snap.doneActions)!==1?"s":""} ouverte${(snap.totalActions-snap.doneActions)!==1?"s":""}${snap.doneActions?" · "+snap.doneActions+" terminée"+(snap.doneActions!==1?"s":""):""}</span>
              </div>
            </div>
            <span style="font-size:10px;color:var(--text3);white-space:nowrap">CR n°${snap.numero} — ${snap.date}</span>
            <button class="btn btn-sm btn-g" style="font-size:10px;padding:3px 8px" onclick="reExport('${currentCR.id}')" title="Réexporter ce CR">
              <svg class="ico ico-xs"><use href="#i-download"/></svg>
            </button>
          </div>`).join('')}
      </div>
    </div>`:''}
  </div>`;

  document.getElementById('content').innerHTML=html;
}

function jumpToCR(id){
  activeCR=id;
  activeTab='remarques';
  renderList();
  // Update tab UI
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active',i===0);
  });
  renderCR();
}

/* ══ TABS ══ */
function switchTab(tab,btn){
  activeTab=tab;
  if(tab!=='remarques'){remarqueSearch='';quickFilter='all';}
  if(tab!=='actions'){actionFilter='';actionStatusFilter='all';}
  document.querySelectorAll('.tab').forEach(t=>{t.classList.remove('active');});
  btn.classList.add('active');
  renderCR();
}

/* ══ LOT & REMARQUE ACTIONS ══ */
function toggleLot(crId,lotId){
  const cr=CRS.find(c=>c.id===crId);
  const lot=cr?.lots.find(l=>l.id===lotId);
  if(lot)lot.ouvert=!lot.ouvert;
  renderCR();
}
function toggleDone(crId,lotId,rId){
  const cr=CRS.find(c=>c.id===crId);
  const lot=cr?.lots.find(l=>l.id===lotId);
  const r=lot?.remarques.find(x=>x.id===rId);
  if(r){
    r.done=!r.done;
    if(r.done){
      r.flag=false;
      r.doneAt=new Date().toLocaleDateString('fr-FR');
    } else {
      r.doneAt=null;
    }
    // If un-checking, also un-archive
    if(!r.done) r.archived=false;
  }
  markDirty();renderCR();renderList();
}
function archiveRemarque(crId,lotId,rId){
  const cr=CRS.find(c=>c.id===crId);
  const lot=cr?.lots.find(l=>l.id===lotId);
  const r=lot?.remarques.find(x=>x.id===rId);
  if(r){
    r.archived=true;
    r.archivedAt=r.doneAt||new Date().toLocaleDateString('fr-FR');
  }
  markDirty();renderCR();renderList();
}
function unarchiveRemarque(crId,lotId,rId){
  const cr=CRS.find(c=>c.id===crId);
  const lot=cr?.lots.find(l=>l.id===lotId);
  const r=lot?.remarques.find(x=>x.id===rId);
  if(r){ r.archived=false; } // stays done=true, shows as strikethrough
  markDirty();renderCR();renderList();
}
function toggleFlag(crId,lotId,rId){
  const cr=CRS.find(c=>c.id===crId);
  const lot=cr?.lots.find(l=>l.id===lotId);
  const r=lot?.remarques.find(x=>x.id===rId);
  if(r)r.flag=!r.flag;
  renderCR();renderList();
}
function deleteRemarque(crId,lotId,rId){
  const cr=CRS.find(c=>c.id===crId);
  const lot=cr?.lots.find(l=>l.id===lotId);
  if(lot)lot.remarques=lot.remarques.filter(r=>r.id!==rId);
  renderCR();renderList();
}
function moveRemarque(crId,lotId,rId,dir){
  const cr=CRS.find(c=>c.id===crId);
  const lot=cr?.lots.find(l=>l.id===lotId);
  if(!lot)return;
  const idx=lot.remarques.findIndex(r=>r.id===rId);
  if(idx<0)return;
  const to=idx+dir;
  if(to<0||to>=lot.remarques.length)return;
  const moved=lot.remarques.splice(idx,1)[0];
  lot.remarques.splice(to,0,moved);
  markDirty();renderCR();
}
function addRemarque(crId,lotId){
  const inp=document.getElementById('new-r-'+lotId);
  if(!inp||!inp.value.trim())return;
  const cr=CRS.find(c=>c.id===crId);
  const lot=cr?.lots.find(l=>l.id===lotId);
  if(!lot)return;
  const flagCb=document.getElementById('new-r-flag-'+lotId);
  const isFlag=flagCb?flagCb.checked:false;
  const newR={
    id:'r'+(uid++),
    texte:inp.value.trim(),
    done:false,
    flag:isFlag,
    decision:false,
    archived:false,
    createdAt:new Date().toLocaleDateString('fr-FR')
  };
  lot.remarques.push(newR);
  inp.value='';
  if(flagCb)flagCb.checked=false;
  markDirty();renderCR();renderList();
}
function editRemarque(crId,lotId,rId){
  const cr=CRS.find(c=>c.id===crId);
  const lot=cr?.lots.find(l=>l.id===lotId);
  const r=lot?.remarques.find(x=>x.id===rId);
  if(!r)return;

  return val;

/* ══ SHARED PDF PAGINATION ══ */
function _estimateRmarkHeight(texte, images) {
  const LINE_H = 17;
  const CHARS_PER_LINE = 90;
  const lines = Math.ceil((texte||'').length / CHARS_PER_LINE) || 1;
  let h = lines * LINE_H + 8;
  if (images && images.length) h += Math.ceil(images.length / 3) * 110 + 8;
  return h;
}

function buildPDFPages(cr) {
  const s = PDF_SETTINGS;
  const A4_CONTENT_H = 1020;
  const PAGE_STYLE = 'padding:20px;font-family:Arial,sans-serif;font-size:9pt;color:#000;page-break-after:always';

  function pageHeader(pageNum) {
    const leftCell = s.showLogoLeft
      ? (s.logoLeft
          ? `<td style="width:${s.logoLeftWidth||60}px;border:1px solid #000;padding:4px;text-align:center;vertical-align:middle"><img src="${s.logoLeft}" style="max-width:${(s.logoLeftWidth||60)-8}px;max-height:44px;object-fit:contain;display:block;margin:0 auto"></td>`
          : `<td style="width:${s.logoLeftWidth||60}px;border:1px solid #000;padding:6px;text-align:center;vertical-align:middle"><div style="font-weight:700;font-size:12pt">${e(s.firmName||'PS')}</div>${s.firmSub?`<div style="font-size:6pt;color:#555">${e(s.firmSub)}</div>`:''}</td>`)
      : `<td style="width:${s.logoLeftWidth||60}px;border:1px solid #000;padding:6px"></td>`;
    const rightCell = s.showLogoRight
      ? (s.logoRight
          ? `<td style="width:${s.logoRightWidth||60}px;border:1px solid #000;border-left:none;padding:4px;text-align:center;vertical-align:middle"><img src="${s.logoRight}" style="max-width:${(s.logoRightWidth||60)-8}px;max-height:44px;object-fit:contain;display:block;margin:0 auto"></td>`
          : `<td style="width:${s.logoRightWidth||60}px;border:1px solid #000;border-left:none;padding:6px;text-align:center;vertical-align:middle"><div style="font-weight:700;font-size:12pt">${e(s.firmName||'PS')}</div></td>`)
      : `<td style="width:${s.logoRightWidth||60}px;border:1px solid #000;border-left:none;padding:6px"></td>`;
    return `<table style="width:100%;border-collapse:collapse;margin-bottom:0">
      <tr>${leftCell}
        <td style="padding:8px 16px;border:1px solid #000;border-left:none;text-align:center">
          <div style="font-weight:700;font-size:12pt;letter-spacing:2px">${e(s.headerTitle||'COMPTE RENDU')}</div>
        </td>${rightCell}
      </tr>
    </table>
    <table style="width:100%;border-collapse:collapse;margin-bottom:10px">
      <tr><td colspan="2" style="padding:5px 8px;border:1px solid #000;border-top:none;font-size:9pt"><strong>PROJET : ${e(cr.projet)}</strong>&nbsp;&nbsp;&nbsp;${e(cr.adresse)}</td></tr>
      <tr>
        <td style="padding:5px 8px;border:1px solid #000;border-top:none;font-size:9pt;width:50%"><strong>DATE :</strong> ${e(cr.date)}</td>
        <td style="padding:5px 8px;border:1px solid #000;border-top:none;border-left:none;font-size:9pt"><strong>PROCHAINE RÉUNION :</strong> ${e(cr.dateProchaine||'—')}</td>
      </tr>
    </table>
    <div style="text-align:right;font-size:7pt;color:#888;margin-bottom:4px">Page ${pageNum} / __TOTAL__</div>`;
  }

  function hexToLight(hex) {
    const h2=(hex||'#ccc').replace('#','');
    if(h2.length<6) return '#f0f0f0';
    const r=parseInt(h2.substr(0,2),16),g=parseInt(h2.substr(2,2),16),b=parseInt(h2.substr(4,2),16);
    return `rgb(${Math.round(r*.2+255*.8)},${Math.round(g*.2+255*.8)},${Math.round(b*.2+255*.8)})`;
  }

  const pages = [];
  let pageNum = 1;
  let currentBlocks = [];
  let currentH = 0;

  function flushPage() {
    if (!currentBlocks.length) return;
    pages.push(`<div class="pr-page" style="${PAGE_STYLE}">${pageHeader(pageNum)}${currentBlocks.join('')}</div>`);
    pageNum++;
    currentBlocks = [];
    currentH = 0;
  }
  function addBlock(html, estH) {
    if (currentH + estH > A4_CONTENT_H && currentBlocks.length > 0) flushPage();
    currentBlocks.push(html);
    currentH += estH;
  }

  // ── Intervenants ──
  const allInts = cr.intervenants;
  const moa = allInts.filter(i=>i.lot.toLowerCase().includes('ouvrage')||i.lot.toLowerCase().includes('moa'));
  const moe = allInts.filter(i=>i.lot.toLowerCase().includes('oeuvre')||i.lot.toLowerCase().includes('moe'));
  const oth = allInts.filter(i=>!moa.includes(i)&&!moe.includes(i));
  const grps = [{label:"MAÎTRISE D'OUVRAGE",rows:moa},{label:"MAÎTRISE D'ŒUVRE",rows:moe},{label:"INTERVENANTS ENTREPRISES",rows:oth}].filter(g=>g.rows.length);

  let intHdr = `<table style="width:100%;border-collapse:collapse;margin-bottom:4px"><tr style="background:#e0e0e0">
    <td colspan="2" style="padding:4px 7px;border:1px solid #000;font-weight:600;font-size:8.5pt">Intervenant / Lot</td>
    <td style="padding:4px 7px;border:1px solid #000;border-left:none;font-weight:600;font-size:8.5pt">Contact</td>
    <td style="padding:4px 7px;border:1px solid #000;border-left:none;font-weight:600;font-size:8.5pt;width:50px;text-align:center">Conv.</td>
    <td style="padding:4px 7px;border:1px solid #000;border-left:none;font-weight:600;font-size:8.5pt;width:50px;text-align:center">Présent</td>
    <td style="padding:4px 7px;border:1px solid #000;border-left:none;font-weight:600;font-size:8.5pt;width:70px;text-align:center">Prochain</td>
  </tr>`;
  let intRows = '';
  grps.forEach(function(g){
    intRows+=`<tr style="background:#e8e8e8"><td colspan="6" style="padding:4px 7px;border:1px solid #000;border-top:none;font-weight:600;font-size:8pt">${g.label}</td></tr>`;
    g.rows.forEach(function(i){
      intRows+=`<tr>
        <td style="padding:3px 7px;border:1px solid #000;border-top:none;font-size:8pt;font-weight:600;vertical-align:top;width:95px">${e(i.lot.toUpperCase())}</td>
        <td style="padding:3px 7px;border:1px solid #000;border-top:none;border-left:none;font-size:8pt;vertical-align:top">${e(i.entreprise)}</td>
        <td style="padding:3px 7px;border:1px solid #000;border-top:none;border-left:none;font-size:7.5pt;vertical-align:top;white-space:pre-line">${e(i.contacts)}</td>
        <td style="padding:3px 7px;border:1px solid #000;border-top:none;border-left:none;text-align:center;font-size:8.5pt">${i.convoque!==false?'X':''}</td>
        <td style="padding:3px 7px;border:1px solid #000;border-top:none;border-left:none;text-align:center;font-size:8.5pt;font-weight:700">${i.present?'X':''}</td>
        <td style="padding:3px 7px;border:1px solid #000;border-top:none;border-left:none;text-align:center;font-size:8.5pt">☐</td>
      </tr>`;
    });
  });
  addBlock(intHdr+intRows+'</table>', allInts.length*22+50);
  flushPage();

  // ── Remarques par lot ──
  cr.lots.forEach(function(lot){
    const active=lot.remarques.filter(function(r){return !r.archived;});
    const archCnt=lot.remarques.filter(function(r){return r.archived;}).length;
    if(!active.length&&!archCnt)return;
    const col=getColor(lot,cr);
    const bg=hexToLight(col);
    const lotHdr=`<div style="background:${bg};padding:5px 8px;border:1px solid #000;font-weight:700;font-size:9pt;text-transform:uppercase;color:${col};page-break-after:avoid">REMARQUES — ${e(lot.titre.toUpperCase())}</div>`;
    if(!active.length){
      addBlock(lotHdr+`<div style="border:1px solid #000;border-top:none;padding:5px 10px;font-size:8pt;color:#999;font-style:italic">Aucune remarque active.</div>`, 52);
    } else {
      // First remark stays with header
      const r0=active[0];
      const r0html=`<div style="padding:3px 0;font-size:9pt;line-height:1.5;border-bottom:1px solid #f0f0f0">- ${e(r0.texte)}</div>`

  // ── Actions ──
  if(cr.actions.length){
    const actHdr=`<div style="background:#d4d4d4;padding:4px 8px;border:1px solid #000;font-weight:700;font-size:9pt;margin-bottom:0">ACTIONS / DÉCISIONS</div>

    addBlock(actHdr, 52);

    cr.actions.forEach(function(a,ai){

        <td style="padding:3px 7px;border:1px solid #000;border-top:none;font-size:8pt;text-align:center;vertical-align:top">${ai+1}</td>
        <td style="padding:3px 7px;border:1px solid #000;border-top:none;border-left:none;font-size:8pt;vertical-align:top">${e(a.texte)}${(a.images&&a.images.length)?`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:2px">${a.images.map(img=>`<img src="${img.data}" style="max-width:70px;max-height:55px;object-fit:contain;border:1px solid #ccc;border-radius:2px">`).join('')}</div>`:''}</td>

        <td style="padding:3px 7px;border:1px solid #000;border-top:none;border-left:none;font-size:8pt;vertical-align:top">${e(a.echeance)}</td>

    }
    flushPage();
  }

  // Fix __TOTAL__ placeholder with real page count
  const total=pages.length;
  return pages.map(function(p){return p.replace(/__TOTAL__/g,String(total));});
}

function exportCR(crId){
  const cr=CRS.find(function(x){return x.id===crId;});
  if(!cr)return;

  const pages=buildPDFPages(cr);
  const fullHTML='<!DOCTYPE html><html><head><meta charset="UTF-8"><style>'
    +'body{font-family:Arial,sans-serif;font-size:9pt;color:#000;margin:0;padding:0}'
    +'table{border-collapse:collapse}'
    +'.pr-page{padding:20px;page-break-after:always}'
    +'.pr-page:last-child{page-break-after:avoid}'
    +'@media print{.pr-page{padding:12mm}}'
    +'</style></head><body>'+pages.join('')+'</body></html>';

  const printArea=document.getElementById('print-area');
  printArea.innerHTML=pages.join('');
  printArea.style.display='block';
  document.getElementById('content').style.display='none';
  document.querySelector('.app').style.display='none';

  markClean();
  savePrintSnapshot(crId);
  window.print();

  setTimeout(function(){
    printArea.style.display='none';
    printArea.innerHTML='';
    document.getElementById('content').style.display='';
    document.querySelector('.app').style.display='flex';
  },1000);
}


function savePrintSnapshot(crId){
  const cr=CRS.find(c=>c.id===crId);
  if(!cr)return;
  const now=new Date();
  const dateStr=now.toLocaleDateString('fr-FR')+' '+now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  // Deep copy the CR state at time of print
  const snapshot={
    id:'snap'+(uid++),
    crId:crId,
    printedAt:dateStr,
    projet:cr.projet,
    date:cr.date,
    numero:cr.numero,
    totalRemarques:cr.lots.flatMap(function(l){return l.remarques;}).length,
    doneRemarques:cr.lots.flatMap(function(l){return l.remarques;}).filter(function(r){return r.archived;}).length,
    totalActions:cr.actions.length,
    doneActions:cr.actions.filter(function(a){return a.done;}).length,
  };
  if(!cr.printHistory) cr.printHistory=[];
  cr.printHistory.unshift(snapshot);
  // Keep max 20 snapshots per CR
  if(cr.printHistory.length>20) cr.printHistory=cr.printHistory.slice(0,20);
  // Show toast after restore
  setTimeout(function(){toast('Export PDF + snapshot enregistré dans l\'historique ✓');},1100);
}

function reExport(crId){exportCR(crId);}

function renameLot(crId,lotId){
  const cr=CRS.find(c=>c.id===crId);
  const lot=cr?.lots.find(l=>l.id===lotId);
  if(!lot)return;
  const name=prompt('Renommer le lot :',lot.titre);
  if(name&&name.trim())lot.titre=name.trim();
  renderCR();
}
function deleteLot(crId,lotId){
  const cr=CRS.find(c=>c.id===crId);
  if(!cr)return;
  const lot=cr.lots.find(l=>l.id===lotId);
  if(!lot)return;
  if(!confirm(`Supprimer le lot "${lot.titre}" et ses ${lot.remarques.length} remarques ?`))return;
  cr.lots=cr.lots.filter(l=>l.id!==lotId);
  renderCR();toast('Lot supprimé');
}

      warn.style.cssText='font-size:11px;color:var(--amber);padding:4px 8px;background:var(--amber-bg);border-radius:4px;margin-bottom:8px;text-align:center';

      var p0=document.getElementById('gs-p0');
      if(p0)p0.insertBefore(warn,p0.firstChild);
      return;
    }
    function makeSortable(containerId,type){
      var el=document.getElementById(containerId);
      if(!el)return;
      Sortable.create(el,{
        animation:150,
        handle:'.sort-handle',
        // Only prevent drag from these — .sort-handle is a plain span, safe to drag
        filter:'input,textarea,select,button,label',
        preventOnFilter:true,
        ghostClass:'sortable-ghost',
        onStart:function(){
          // Save all field values into data before DOM is mutated by drag
          _saveSettingsFields(crId);
        },
        onEnd:function(evt){
          if(evt.oldIndex===evt.newIndex)return;
          moveItem(type,crId,evt.oldIndex,evt.newIndex,true);
        }
      });
    }
    makeSortable('gs-lots-list','lot');
    makeSortable('gs-ints-list','int');
    makeSortable('gs-acts-list','act');
  },120);
}

function gsDeleteLot(crId,lotId){
  const cr=CRS.find(c=>c.id===crId);
  if(!cr)return;
  const lot=cr.lots.find(l=>l.id===lotId);
  if(!lot||!confirm('Supprimer le lot "'+lot.titre+'" et ses '+lot.remarques.length+' remarques ?'))return;
  cr.lots=cr.lots.filter(l=>l.id!==lotId);
  openCRSettings(crId);
}
function gsAddLot(crId){
  const cr=CRS.find(c=>c.id===crId);
  if(!cr)return;
  if(!cr.intervenants.length){toast('Ajoutez d\'abord un intervenant','var(--amber)');return;}
  // Use first intervenant by default
  const firstInt=cr.intervenants[0];
  cr.lots.push({id:'l'+(uid++),titre:firstInt.lot,ouvert:true,intId:firstInt.id,remarques:[]});
  openCRSettings(crId);
}
function gsDeleteInt(crId,idx){
  const cr=CRS.find(c=>c.id===crId);
  if(!cr)return;
  const int=cr.intervenants[idx];
  if(!int)return;
  // Check if any lots are linked to this intervenant
  const linked=cr.lots.filter(function(l){return l.intId===int.id;});
  if(linked.length>0){
    if(!confirm('Supprimer "'+( int.entreprise||int.lot)+'" ?\n\nAttention : '+linked.length+' lot(s) lui sont liés ('+linked.map(function(l){return l.titre;}).join(', ')+').\nCes lots seront aussi supprimés.'))return;
    cr.lots=cr.lots.filter(function(l){return l.intId!==int.id;});
  } else {
    if(!confirm('Supprimer "'+(int.entreprise||int.lot)+'" ?'))return;
  }
  cr.intervenants.splice(idx,1);
  openCRSettings(crId);
}

function saveSettings(crId){
  const cr=CRS.find(c=>c.id===crId);
  if(!cr)return;
  // Save lots names + intId links
  cr.lots.forEach(lot=>{
    const el=document.getElementById('gs-lot-'+lot.id);
    if(el&&el.value.trim())lot.titre=el.value.trim();
    const intEl=document.getElementById('gs-lot-int-'+lot.id);
    if(intEl&&intEl.value)lot.intId=intEl.value;
    // lot.color is now derived from intervenant — don't save separately
  });
  // Validate: every lot must have an intId
  const orphans=cr.lots.filter(function(l){return !l.intId||!cr.intervenants.find(function(i){return i.id===l.intId;});});
  if(orphans.length){
    toast(orphans.length+' lot(s) sans intervenant — sélectionnez un intervenant pour chaque lot','var(--amber)');
    return;
  }
  // Save intervenants
  cr.intervenants.forEach((int,ii)=>{
    const lot=document.getElementById('gs-int-lot-'+ii);
    const ent=document.getElementById('gs-int-ent-'+ii);
    const contacts=document.getElementById('gs-int-contacts-'+ii);
    const colorEl=document.getElementById('gs-int-color-'+ii);
    if(lot)int.lot=lot.value||int.lot;
    if(ent)int.entreprise=ent.value||'';
    if(contacts)int.contacts=contacts.value||'';
    if(colorEl)int.color=colorEl.value;
  });
  // Save actions
  cr.actions.forEach(a=>{
    const texte=document.getElementById('gs-a-texte-'+a.id);
    const intEl=document.getElementById('gs-a-int-'+a.id);
    const ech=document.getElementById('gs-a-ech-'+a.id);
    const done=document.getElementById('gs-a-done-'+a.id);
    if(texte&&texte.value.trim())a.texte=texte.value.trim();
    if(intEl){
      a.intId=intEl.value||null;
      const linked=a.intId?cr.intervenants.find(i=>i.id===a.intId):null;
      a.responsable=linked?(linked.entreprise||linked.lot):a.responsable;
    }
    if(ech)a.echeance=ech.value||'';
    if(done)a.done=done.checked;
  });
  closeModal();
  // Stay on intervenants tab so user sees the color change immediately
  activeTab='intervenants';
  renderCR();
  // Reset tab buttons
  setTimeout(function(){
    document.querySelectorAll('.tab').forEach(function(t,i){
      t.classList.toggle('active',i===1);
    });
  },10);
  renderList();
  saveCRS();toast('Tout enregistré ✓');
}

function toggleArchiveCR(crId){
